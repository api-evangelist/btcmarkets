info:
  version: 3.0.0
  title: BTC Markets Trade APIs API
  contact:
    name: API Support
    email: support@btcmarkets.net
    url: http://btcmarkets.net
  x-logo:
    url: /doc/images/small-logo.png
    altText: BtcMarkets logo
  description: '# Introduction

    Welcome to BTC Markets API v3.'
servers:
- url: https://api.btcmarkets.net
  description: Production
tags:
- name: Trade APIs
paths:
  /v3/trades:
    get:
      tags:
      - Trade APIs
      operationId: getTrades
      summary: List Trades
      description: Retrieves trades and optionally filters by marketId or orderId/clientOrderId. The default behavior when no query parameter is specified is to return your most recent trades for all orders and markets. When a valid order ID is provided, all trades for the order are returned. Providing `marketId` also filters trades. Mixing `orderId` and `marketId` parameters is not supported.
      parameters:
      - name: marketId
        in: query
        required: false
        schema:
          type: string
          description: optionally filter trades by marketId (e.g. XRP-AUD)
      - name: orderId
        in: query
        required: false
        schema:
          type: string
          description: optionally list all trades for a single order
      - name: before
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234976
      - name: after
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234876
      - name: limit
        in: query
        description: This is part of the pagination parameters.
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                basic:
                  $ref: '#/components/examples/TradeListExample'
  /v3/trades/{id}:
    get:
      tags:
      - Trade APIs
      operationId: getTradeById
      summary: Get Trade by ID
      description: Retrieves a trade by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
