openapi: 3.2.0
info:
  version: 3.0.0
  title: BTC Markets Account APIs API
  contact:
    name: API Support
    email: support@btcmarkets.net
    url: http://btcmarkets.net
  x-logo:
    url: /doc/images/small-logo.png
    altText: BtcMarkets logo
  description: '# Introduction

    Welcome to BTC Markets API v3.'
servers:
- url: https://api.btcmarkets.net
  description: Production
tags:
- name: Account APIs
paths:
  /v3/accounts/me/trading-fees:
    get:
      tags:
      - Account APIs
      summary: Get Trading Fees
      description: Returns 30 day trading fee volume plus the trading fee per market that covers `marker` and `taker`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                basic:
                  $ref: '#/components/examples/TradingFeeExample'
      operationId: getV3AccountsMeTradingFees
      x-operation-id-source: derived
  /v3/accounts/me/withdrawal-limits:
    get:
      tags:
      - Account APIs
      summary: Get Withdrawal Limits
      description: This API returns daily withdrawal limits per asset for your account.
      operationId: getV3AccountsMeWithdrawalLimits
      x-operation-id-source: derived
  /v3/accounts/me/balances:
    get:
      tags:
      - Account APIs
      summary: Get Balances
      description: 'Returns list of assets covering the balance, available, and locked amount for each asset due to open orders or pending withdrawals.

        This formula represents the relationship between those three elements: `balance = available + locked`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                basic:
                  $ref: '#/components/examples/BalanceListExample'
      operationId: getV3AccountsMeBalances
      x-operation-id-source: derived
  /v3/accounts/me/transactions:
    get:
      tags:
      - Account APIs
      summary: Get Transactions
      description: Returns detailed ledger records for underlying wallets. This API supports pagination.
      parameters:
      - name: assetName
        in: query
        required: false
        description: filter transactions for specific asset
        schema:
          type: string
        example: BTC
      - name: before
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234976
      - name: after
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234876
      - name: limit
        in: query
        description: This is part of the pagination parameters.
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                basic:
                  $ref: '#/components/examples/TransactionListExample'
      operationId: getV3AccountsMeTransactions
      x-operation-id-source: derived
