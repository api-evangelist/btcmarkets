                  amount: '1.034'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                basic:
                  $ref: '#/components/examples/BasicOrderExample'
                allAttributes:
                  $ref: '#/components/examples/AllOrderExample'
