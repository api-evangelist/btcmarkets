                  summary: missing clientOrderId
                  value:
                    code: OrderStatusIsFinal
                    message: Order cancellation is not allowed
  /v3/batchorders:
    post:
      tags:
      - Batch Order APIs
      summary: Place and Cancel Orders
      description: "\nUse this API to place multiple new orders or cancel existing ones via a single request. The request for batch processing is an array of items, and each item contains instructions for an order placement and a cancellation.\nThere are restrictions on the number of items in a batch (currently set to 10), so a batch can contain up to four items in any form that is needed. For instance, it can contain four placements (hence four items in the array), four cancellations, or an array of two items with two order placements and two cancellations.\n\nBatch operations are only containers for multiple requests, so each individual request is handled separately from the rest of the requests in the batch.\n\nOnce all items in the batch are processed, a single response containing orders added and orders canceled is returned along with an attribute called `unprocessedRequests` that is an array of any item in the batch that can't be processed.\n\nOne major difference between using batch\
        \ requests and individual requests is the approach to error handling. In the case of using individual requests, if the request is invalid (e.g. invalid price), then an HTTP 400 error is returned.\nHowever, when using batch requests (even with a single item) you will receive an HTTP code of 200 and you should parse the `unprocessedRequests` inside the response body to determine if there are any errors processing individual requests.\n\nThere are cases where the entire batch request is considered invalid and an HTTP error `400` is returned (e.g., batch size exceeds the limit). Therefore, when handling batch requests, your client needs to handle HTTP status codes as well as error messages inside the response body.\n\nAnother difference is that you must provide `clientOrderId` when placing orders in batch. This allows items inside a batch request to be tracked and processed accurately.\nWhen canceling orders, you can either use `orderId` or `clientOrderId` within the request. `clientOrderId`\
        \ is only mandatory for creating new orders.\n\nA `requestId` that appears inside the `unprocessedRequests` represents whatever ID was used to identify an order (e.g., clientOrderId or orderId).\n\nOne sample use case of batch processing is simulating the update order in a single HTTP call that is canceling an existing order and then creating a new order. In order to achieve this outcome, use the following request sample:\n\n``` json\n [\n   {\n     \"cancelOrder\": {\n       \"clientOrderId\": \"27\"\n     }\n   },\n   {\n     \"placeOrder\": {\n       \"marketId\": \"XRP-AUD\",\n       \"side\": \"Bid\",\n       \"type\": \"Limit\",\n       \"price\": \"0.22\",\n       \"amount\": \"0.26\",\n       \"clientOrderId\": \"28\"\n     }\n   }\n ]\n```\nIn the above sample, the existing order with ID `27` is canceled and a new order with ID 28 will be created.\n\nYou can still take advantage of `/3/batchorders{ids}` in order to cancel orders and use this API for placing orders only.\n"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - description: Place new orders or cancel existing ones
                title: Batch order request
              - $ref: '#/components/schemas/BatchOrderRequests'
            examples:
              bid:
                $ref: '#/components/examples/BatchOrderRequestExample'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                basic:
                  $ref: '#/components/examples/BatchOrderProcessingWithErrorExample'
                allErrors:
                  $ref: '#/components/examples/BatchOrderProcessingAllErrorsExample'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                missingParam:
                  summary: missing clientOrderId
                  value:
                    code: InvalidClientOrderId
                    message: a unique client order id is required for batch order placement
