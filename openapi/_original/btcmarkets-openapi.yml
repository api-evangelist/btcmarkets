        '403':
          description: Forbidden
      x-code-samples:
      - lang: Javascript
        source: "const crypto = require('crypto');\nconst https = require('https');\n\nconst apiKey = \"add api key here\";\nconst privateKey = \"add private key here\";\n\nconst placeOrderDataObj = {marketId: 'XRP-AUD',price: '0.34', amount:\"1.0\", side: \"Bid\", type: \"Limit\" };\nconst data = JSON.stringify(placeOrderDataObj);\nconst path = '/v3/orders';\n\nconst now = Date.now();\nconst message =  \"POST\" + path + now + data;\n\nvar buffer = Buffer.from(privateKey, 'base64');\nvar hmac = crypto.createHmac('sha512', buffer);\nconst signature = hmac.update(message).digest('base64');\n\nconst headers = {\n\t\t\"Accept\": \"application/json\",\n\t\t'Content-Length': Buffer.byteLength(data),\n\t\t\"Content-Type\": \"application/json\",\n\t\t\"BM-AUTH-APIKEY\": apiKey,\n\t\t\"BM-AUTH-TIMESTAMP\": now,\n\t\t\"BM-AUTH-SIGNATURE\": signature\n};\nvar postOptions = {host: \"api.btcmarkets.net\", path: path, method: 'POST', headers: headers};\nvar postReq = https.request(postOptions, function(res)\
          \ {\n\tres.on('data', function (chunk) {\n\t\tconsole.log('Http Response Code: ' + res.statusCode);\n\t\tconsole.log('Response: ' + chunk);\n\t});\n});\n\npostReq.write(data);\npostReq.end();\n"
    get:
      summary: List Orders
      description: Returns an array of historical orders or open orders only. All query string parameters are optional, so by default and when no query parameter is provided, this API retrieves open orders only for all markets. This API supports pagination only when retrieving all orders `status=all`. When sending using `status=open`, all open orders are returned and with no pagination.
