components:
  schemas:
    OrderStatus:
      type: string
      enum:
      - Accepted
      - Placed
      - Partially Matched
      - Fully Matched
      - Cancelled
      - Partially Cancelled
      - Failed
    OrderType:
      type: string
      enum:
      - Limit
      - Market
      - Stop Limit
      - Stop
      - Take Profit
      description: type of the order
    OrderSide:
      type: string
      enum:
      - Bid
      - Ask
      description: side of the order
    PlaceOrderRequest:
      type: object
      required:
      - marketId
      - price
      - amount
      - type
      - side
      properties:
        marketId:
          description: specify a marketId e.g. BTC-AUD
          type: string
        price:
          description: null
          type: string
        amount:
          description: null
          type: string
        type:
          $ref: '#/schemas/OrderType'
        side:
          $ref: '#/schemas/OrderSide'
        triggerPrice:
          description: this is mandatory if order type is Stop, Stop Limit or Take Profit
          type: string
        targetAmount:
          description: specifiy target amount when a desired target outcome is required for order execution
          type: string
        timeInForce:
          description: possible values are GTC (default option) , FOK and IOC
          type: string
        postOnly:
          description: if this is a post-only order
          type: boolean
        selfTrade:
          description: A or P
          type: string
        clientOrderId:
          description: a unique order id speciifed by client app.
          type: string
    ReplaceOrderRequest:
      type: object
      required:
      - price
      - amount
      properties:
        price:
          description: null
          type: string
        amount:
          description: null
          type: string
        clientOrderId:
          description: optional. a unique order id speciifed by client app.
          type: string
    CancelOrderRequest:
      type: object
      properties:
        orderId:
          description: exchange generated order id
          type: string
        clientOrderId:
          description: client generated order id
          type: string
    BatchOrderRequest:
      type: object
      properties:
        placeOrder:
          $ref: '#/schemas/PlaceOrderRequest'
        cancelOrder:
          $ref: '#/schemas/CancelOrderRequest'
    BatchOrderRequests:
      type: array
      items:
        $ref: '#/schemas/BatchOrderRequest'
    BeneficiaryDetail:
      type: object
      description: 'Beneficiary information for the withdrawal recipient, required to comply with AUSTRAC''s travel rule obligations.

        Currently optional, but will become mandatory from `2026-06-15 12:00 AEST`. Once mandatory, requests without this attribute will fail with the error code `InvalidTransferBeneficiaryDetail`.

        '
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - Individual
          - Business
          description: type of the beneficiary. Determines which additional fields are required.
        firstName:
          type: string
          description: beneficiary first name. Required when `type` is `Individual`.
        lastName:
          type: string
          description: beneficiary last name. Required when `type` is `Individual`.
        businessName:
          type: string
          description: legal business name. Required when `type` is `Business`.
    CreateWithdrawRequest:
      type: object
      required:
      - assetName
      - amount
      properties:
        assetName:
          type: string
          description: name of the asset to withdraw e.g. `AUD` or `BTC`
        amount:
          type: string
          description: amount to withdraw
        toAddress:
          type: string
          description: destination address for crypto withdrawal. mandatory for crypto assets. For `XRP` withdrawals, you can optionally add destination tag to the address with `?dt=12345` e.g. `1EJKj147QmEzywLnLpuxSr6SoPr1p62VBX?dt=123456`
        accountName:
          type: string
          description: optional for AUD withdrawal. when not specified default bank information is used
        accountNumber:
          type: string
          description: optional for AUD withdrawal. when not specified default bank information is used
        bsbNumber:
          type: string
          description: optional for AUD withdrawal. when not specified default bank information is used
        bankName:
          type: string
          description: optional for AUD withdrawal. when not specified default bank information is used
        paymentDescription:
          type: string
          description: optional for AUD withdrawal. Maximum character length of 18 and only alphanumeric
        clientTransferId:
          type: string
          description: optional for withdrawal requests.
        beneficiaryDetail:
          $ref: '#/schemas/BeneficiaryDetail'
    Order:
      type: object
      properties:
        orderId:
          type: string
        marketId:
          type: string
        side:
          type: string
        type:
          type: string
        creationTime:
          type: string
        price:
          type: string
        amount:
          type: string
        openAmount:
          type: string
        status:
          type: string
        triggerPrice:
          type: string
        targetAmount:
          type: string
        timeInForce:
          type: string
        postOnly:
          type: boolean
        selfTrade:
          type: string
        errorMessage:
          type: string
          description: Indicates why the order failed after it was accepted. This attribute is null in most situations except for rare cases where the order is accepted at the point of entry but then rejected by the matching engine (e.g., due to insufficient funds).
        clientOrderId:
          type: string
    CancelOrders:
      type: object
      properties:
        marketId:
          description: comma delimited list of marketIds. e.g. BTC-AUD,ETH-AUD
    CancelOrderResponse:
      type: object
      properties:
        orderId: type:string
        clientOrderId: type:string
    CreateReportRequest:
      type: object
      required:
      - type
      - format
      properties:
        type:
          description: type of the report. the only accepted values are `TransactionReport` or `AccountTradingReport` at this stage.
          type: string
        format:
          description: value can be  either `csv` or `json`
          type: string
  requestBodies:
    PlaceOrderRequest:
      content:
        application/json:
          schema:
            allOf:
            - description: Place new order
              title: New order request
            - $ref: '#/schemas/PlaceOrderRequest'
          examples:
            bid:
              summary: new order example
              value:
                marketId: BTC-AUD
                price: '100.12'
                amount: '0.034'
                type: Limit
