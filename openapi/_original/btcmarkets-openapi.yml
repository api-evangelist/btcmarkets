  /v3/withdrawals:
    post:
      tags:
      - Fund Management APIs
      summary: Request to Withdraw
      description: "This API is used to request to withdraw crypto assets or `AUD`.\n## Withdrawal/Deposit Status\n- `Accepted`: The withdrawal request has been accepted for processing.\n- `Pending Authorization`: The withdrawal request has been accepted and is being processed.\n- `Complete`: The withdrawal/deposit request has been successfully processed.\n- `Cancelled`: The withdrawal request has been canceled due to issues with the request.\n- `Failed`: The withdrawal request has been failed due to a system error.\n\n## clientTransferId:\n- This is an optional parameter that can be set by the client applications to track withdrawals. In addition to retrieving withdrawal records, e.g. `GET /v3/withdrawals/a4`, it can also be useful in the event of a network issue or a timeout to track any previous withdrawal requests. It is a string field between 1 to 64 with the following characters allowed: a-z, A-Z, 0-9, - allowing standard formats like UUID.\n\n## beneficiaryDetail (Travel Rule):\n\
        - To comply with AUSTRAC's travel rule obligations, withdrawal requests can include a `beneficiaryDetail` object describing the recipient.\n- The `type` attribute can be either `Individual` or `Business`:\n    - For `Individual`, supply `firstName` and `lastName`.\n    - For `Business`, supply `businessName`.\n- This attribute is currently **optional**. From `2026-06-15 12:00 AEST` it will become **mandatory**, and requests without it will be rejected with the error code `InvalidTransferBeneficiaryDetail`.\n- When supplied, `beneficiaryDetail` is stored against the withdrawal record and returned in responses for listing withdrawals (`GET /v3/withdrawals`) and transfers (`GET /v3/transfers`).\n"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - description: request to withdraw
                title: New request
              - $ref: '#/components/schemas/CreateWithdrawRequest'
            examples:
              crypto:
                summary: crypto
                value:
                  assetName: XRP
                  amount: '25'
                  toAddress: abc
                  clientTransferId: a3
                  beneficiaryDetail:
                    type: Individual
                    firstName: John
                    lastName: Smith
              fiat:
                summary: fiat
                value:
                  assetName: AUD
                  amount: '10'
                  accountName: John Smith
                  accountNumber: '123456'
                  bsbNumber: '123456'
                  bankName: ABC Bank
                  paymentDescription: Ref 100002
                  clientTransferId: a3
                  beneficiaryDetail:
                    type: Business
                    businessName: ABC Trading Inc
      responses:
