- name: WS_Overview
  x-displayName: WebSocket Overview
  description: "\nBTC Markets' WebSocket feed provides real-time market data covering orderbook updates, order life cycle, and trades.\n\nIn order to start receiving real-time messages, a WebSocket connection needs to be made. This should be followed by a message to subscribe to the channels and marketIds you are interested in.\n\n### Endpoint\n\nThe endpoint for WebSocket v2 is: `wss://socket.btcmarkets.net/v2`.\n\n### Channels\n  `tick`, `trade`, `orderbook`, `orderbookUpdate`, `orderChange`, `fundChange`, `heartbeat`\n\n### MarketIds\nMarketIds represent a list of markets and are used to filter events for only the specific markets you are interested in.\n\nYou should be able to get a list of active markets from here:\nhttps://api.btcmarkets.net/v3/markets\n\nFormat: `BTC-AUD`, `XRP-BTC`, etc.\n\nNote: marketIds are only applicable to public events (e.g. `tick`, `orderbook`, `trade`).\n\n### Message Types\nAll messages published include a `json` attribute called `messageType` that represents\
    \ the type of event that is being received.\n\nThose message types events include:\n- `tick`\n- `trade`\n- `orderbook`\n- `orderbookUpdate`\n- `orderChange`\n- `fundChange`\n- `error`\n- `heartbeat`\n\n### Subscriptions\nSending a `subscribe` message allows you to start receiving events for the specified channels and marketIds.  If you need to change your subscription, then simply send a new `subscribe` message with new channel names and marketIds.\n\n### Managing Subscriptions\n While sending a `subscribe` message works in most situations, there may be times you want to have the flexibility to add or remove subscriptions instead of subscribing to all channels/markets at the same time.\n\n In those situations, send the same subscription message (all rules apply for authentication, marketIds, etc.) and the message type will be `addSubscription` or `removeSubscription`. If you need to remove the subscription for all markets for a given channel, just send an empty list of marketIds.\n\n\
    \ Note when using `addSubscription` and `removeSubscription`:\n * In order to use those messages, you will need an existing subscription, so make sure to send a valid subscription message at least once.\n * With your subscription message (and also add/remove messages) send the additional parameter: `clientType: \"api\"`.\n\n\n\n### Client Libraries\nBelow are working examples of how to connect to this WebSocket feed in different languages:\n\n* Javascript: https://github.com/ngin-io/websocket-client-node\n* Java: https://github.com/ngin-io/websocket-client-java\n* Python: https://github.com/ngin-io/websocket-client-python\n\n### Rate Limit\nNew connections to the WebSocket feed are rate limited to 3 attempts per 10 seconds per IP. Frequent WebSocket connections that exceed the rate limit will be closed by the server.\n\n### Connection Issues\nFrom time to time, your WebSocket connection may be disconnected (e.g. as we upgrade software on our servers). We recommend adding logic to your\
    \ client in order to refresh your connection every 24 hours or in case of the connection dropping out.\n"
- name: WS_Public_Events
  x-displayName: WebSocket Public Events
  description: "\n## Tick Event\nThe `tick` event is published every time `lastPrice`, `bestBid`, or `bestAsk` is updated for a market which is the result of orderbook changes or trade matches.\n\nSample event:\n  ```javscript\n  { marketId: 'XRP-AUD',\n    timestamp: '2021-12-01T05:47:35.185Z',\n    bestBid: '1.4028',\n    bestAsk: '1.4047',\n    lastPrice: '1.4031',\n    volume24h: '1055000.9042866',\n    volumeQte24h: '1480271.76880452',\n    price24h: '0.0191',\n    pricePct24h: '1.38',\n    messageType: 'tick',\n    low24h: '1.3862',\n    high24h: '1.45',\n    snapshotId: 1638337655185000\n  }  \n  ```\n\n## Trade Event\n  In order to receive `trade` events, please add `trade` to the list of channels when subscribing via WebSocket.\n\nSample event:\n\n  ```javscript\n  { marketId: 'BTC-AUD',\n    timestamp: '2019-04-08T20:54:27.632Z',\n    tradeId: 3153171493,\n    price: '7370.11',\n    volume: '0.10901605',\n    side: 'Ask',\n    messageType: 'trade'\n  }\n  ```\n## Orderbook Event\n\
    \  In order to receive `orderbook` events, please add `orderbook` to the list of channels when subscribing via WebSocket. The current orderbook event represents the latest orderbook state. A maximum of 50 bids and asks are included in each event.\n\n  For efficiency, the `bids` and `asks` are are published as arrays of `tuples` representing `[price, volume]` for each order in the orderbook.\n\nSample event:\n\n  ```javascript\n  { marketId: 'BTC-AUD',\n    timestamp: '2019-04-08T22:23:37.643Z',\n    bids:\n      [ [ '7418.46', '0.04' ],\n        [ '7418.45', '0.56' ],\n        [ '7100', '0.01' ] ]\n      asks:\n        [ [ '7437.53', '0.76' ],\n          [ '7437.54', '0.3646349' ],\n          [ '7446.94', '0.6' ],\n          [ '7700', '0.1' ] ]\n      messageType: 'orderbook',\n      snapshotId: 1638338323367000\n  }\n  ```\n## OrderbookUpdate Event\nIn many cases, it's more appropriate to maintain a local copy of the exchange orderbook by receiving only updates instead of the entire\
    \ orderbook.\n\nSome advantages of using `orderbookUpdate` as opposed to `orderbook` are:\n1. `orderbook` event only delivers top 50 orders, whereas `orderbookUpdate` covers the entire orderbook.\n2. `orderbook` always uses larger bandwidth due to the size of the messages that include 50 bids/asks, whereas `orderbookUpdate` only delivers small incremental changes.\n3. We make the best effort to deliver all individual updates to the orderbook via `orderbookUpdate` messages. However, `orderbook` may only send a single message if two updates happen at a very close millisecond interval.\n\n### Orderbook Snapshot Message:\n\nSubscribing to the `orderbookUpdate` channel allows you to receive a snapshot of the orderbook at first (immediately after subscription), and then the subsequent messages only provide updates to the orderbook.\nThe initial orderbook snapshot message covers all bids/asks represented as arrays of [price, volume, count] tuples as well as `snapshot:true` attribute.\n\nSample\
    \ snapshot message:\n\n ```javascript\n  { marketId: 'LTC-AUD',\n    snapshot: true,\n    timestamp: '2020-01-08T19:47:13.986Z',\n    snapshotId: 1578512833978000,\n      bids:\n      [ [ '99.57', '0.55', 1 ],\n        [ '97.62', '3.20', 2 ],\n        [ '97.07', '0.9', 1 ],\n        [ '96.7', '1.9', 1 ],\n        [ '95.8', '7.0', 1 ] ],\n      asks:\n        [ [ '100', '3.79', 3 ],\n          [ '101', '6.32', 2 ] ],\n      messageType: 'orderbookUpdate'\n  }\n  ```\n\n\n ### Orderbook Update Message:\n\n The message format for subsequent orderbook updates is the same as the initial snapshot except that it does not have the element `snapshot:true` in it.\n The subsequent messages only provide updates to the orderbook. The update message is in the form of an array of [price, volume, count] tuples aggregating order volumes for a given price and total number of orders for that price.\n For instance, [\"99.57\",\"0.55\",2] means the total volume of bids for the price of `99.57` is `0.55`\
    \ and there is a single order with that price.\n\n Sample update message:\n\n ```javascript\n  { marketId: 'LTC-AUD',\n    timestamp: '\"2020-01-08T19:47:24.054Z',\n    snapshotId: 1578512844045000,\n    bids:  [ ['99.81', '1.2', 1 ], ['95.8', '0', 0 ]],\n    asks: [ ['100', '3.2', 2 ] ],\n    messageType: 'orderbookUpdate',\n    checksum: '3743243528'\n  }\n  ```\n\n ### How to use Orderbook Updates:\n\n In the above sample update message:\n * A new bid order has been added to the orderbook with a price of `99.81` and total volume of `1.2`.\n * The bid order with the price of `95.8` has been removed from the orderbook (hence both the volume and count are zero).\n * The total volume and order count for the ask order with a price of 100 have been changed. The new total volume is `3.2` and there are two orders with that price.\n\n\n Assuming you have a local copy of the exchange orderbook (as per the sample snapshot above), then applying orderbook update means:\n * Add a new bid order\
    \ tuple with price of `99.81` to your orderbook copy.\n * Remove the bid order tuple with price of `95.8` from your orderbook copy.\n * Replace the ask order tuple with price of `100` with new volume and count in your orderbook copy.\n\n\n ### Maintaining a Local Copy of the Exchange Orderbook\n\n The following steps can be used to maintain an up-to-date copy of the exchange orderbook for a given market:\n\n * Subscribe to `orderbookUpdate` channel and provide a marketId.\n * Start to queue all incoming messages.\n * As soon as you receive a message with `snapshot:true`, keep it as your local orderbook copy.\n * Iterate through the items in the queue and apply changes to your local orderbook copy.\n * When applying items from the queue, disregard items with a snapshotId smaller or equal to the snapshotId of your local orderbook copy.\n * Once all items in the queue are processed, your local orderbook copy is up to date.\n * Now apply all incoming messages as they arrive.\n\n It's a good\
    \ practice to refresh your copy at some interval (e.g. once every few hours).\n\n #### Orderbook Update Checksum\n Every orderbookUpdate event will have a checksum number as part of the message. The checksum is a CRC32 value based on the top 10 bids and top 10 asks that can be used by a client application to verify that the local orderbook data is in the correct state. It can be used as a signal to refresh the orderbook in case the data is out of date.\n \n Please refer to the following sample as a guide to generate checksum for orderbookUpdate events:\n * https://github.com/ngin-io/websocket-checksum\n\n\n## Heartbeat Event\n  If you subscribe to `heartbeat` event then the server will send you a heartbeat event every five seconds.\n\n  heartbeat event:\n    ``` javascript\n    {\n      messageType: 'heartbeat',\n      channels: [\n      {\n        name: 'orderChange'\n      },\n      {\n        name: 'orderbook',\n        marketIds: [\n          'BTC-AUD',\n          'XRP-AUD'\n   \
    \     ]\n      },\n      {\n        name: 'heartbeat'\n      }\n      ]\n    }\n    ```\n    Note: Once a new subscription request is confirmed, a single `heartbeat` event is published to the client in order to confirm the connection is working. This is regardless of requesting to subscribe to the `heartbeat` channel.\n\n\n## Error Event\n  In case of errors, a message type of `error` is published.\n\n  * Authentication error\n  * Invalid input error\n  * Internal server error\n  * Throttle error\n\n  Sample error events:\n\n  * Invalid Channel names\n  ```javascript\n  {\n      messageType: 'error',\n      code: 3,\n      message: 'invalid channel names'\n  }\n  ```\n\n  * Invalid MarketIds\n  ```javascript\n  { messageType: 'error',\n    code: 3,\n    message: 'invalid marketIds'\n  }\n  ```\n\n  * Authentication error\n  ``` javascript\n  { messageType: 'error',\n    code: 1,\n    message: 'authentication failed. invalid key'\n  }\n  ```\n\n## Sample Code (javascript)\n\n  The sample\
    \ code below connects to the `tick` channel. The same code can be used to subscribe to other public channels, including `heartbeat`.\n\n\n  ```javascript\n  const WebSocket = require('ws');\n  const ws = new WebSocket('wss://socket.btcmarkets.net/v2');\n\n  var request = {\n    marketIds:marketIds,\n    channels: channels,\n    messageType: 'subscribe'\n  }\n\n  ws.on('open', function open() {\n    ws.send(JSON.stringify(request));\n  });\n\n  ws.on('message', function incoming(data) {\n    console.log(data);\n  });\n  ```\n"
- name: WS_Private_Events
  x-displayName: WebSocket Private Events
  description: "\n## Authenticated Events\n  Receiving events about the life cycle of your orders requires sending authentication information when subscribing to events. The authentication is similar to public trading API authentication (using your API key and secret to sign  the message) when subscribing via WebSocket.\n\nBelow is sample `javascript` code with authentication:\n\n  ```javascript\n  const crypto = require('crypto');\n  const WebSocket = require('ws');\n\n  const key = 'your api key';\n  const secret = 'your api key secret';\n\n  const ws = new WebSocket('wss://socket.btcmarkets.net/v2');\n\n  const now = Date.now();\n  const strToSign =  \"/users/self/subscribe\" + \"\\n\" + now;\n  const signature = signMessage(secret, strToSign);\n\n  var request = {\n    marketIds:['BTC-AUD'],\n    channels: ['orderChange', 'heartbeat'],\n    key: key,\n    signature: signature,\n    timestamp: now,\n    messageType: 'subscribe'\n  }\n\n  ws.on('open', function open() {\n    ws.send(JSON.stringify(request));\n\
    \  });\n\n  ws.on('message', function incoming(data) {\n    console.log(data);\n  });\n\n  function signMessage(secret, message) {\n    var key = Buffer.from(secret, 'base64');\n    var hmac = crypto.createHmac('sha512', key);\n    var signature = hmac.update(message).digest('base64');\n    return signature;\n  }\n  ```\n\n## Order Life Cycle Events\n\n  Below are events that are published for every step of order processing.\n\n\n  ### Placed\n\n  ``` javascript\n  { orderId: 79003,\n    marketId: 'BTC-AUD',\n    side: 'Bid',\n    type: 'Limit',\n    openVolume: '1',\n    status: 'Placed',\n    triggerStatus: '',\n    trades: [],\n    timestamp: '2019-04-08T20:41:19.339Z',\n    messageType: 'orderChange',\n    clientOrderId: 'abc-id'\n  }\n  ```\n\n  ### Fully Matched\n\n  ```javscript\n  { orderId: 79033,\n    marketId: 'BTC-AUD',\n    side: 'Bid',\n    type: 'Limit',\n    openVolume: '0',\n    status: 'Fully Matched',\n    triggerStatus: '',\n    timestamp: '2019-04-08T20:50:39.658Z',\n\
    \    trades: [{\n               tradeId: 31727,\n               price: '0.1634',\n               volume: '10',\n               fee: '0.001',\n               liquidityType: 'Taker',\n               valueInQuoteAsset: '1.634'\n             }],\n    messageType: 'orderChange',\n    clientOrderId: 'abc-id'\n  }\n  ```\n\n  ### Cancelled\n  ```javscript\n  { orderId: 79003,\n    marketId: 'BTC-AUD',\n    side: 'Bid',\n    type: 'Limit',\n    openVolume: '1',\n    status: 'Cancelled',\n    triggerStatus: '',\n    trades: [],\n    timestamp: '2019-04-08T20:41:41.857Z',\n    messageType: 'orderChange',\n    clientOrderId: 'abc-id'\n  }\n  ```\n\n  ### Partially Matched\n  ```javscript\n  { orderId: 79003,\n    marketId: 'BTC-AUD',\n    side: 'Bid',\n    type: 'Limit',\n    openVolume: '1',\n    status: 'Partially Matched',\n    triggerStatus: '',\n    timestamp: '2019-04-08T20:41:41.857Z',\n    trades: [{\n               tradeId: 31927,\n               price: '0.1634',\n               volume:\
    \ '5',\n               fee: '0.001',\n               liquidityType: 'Taker',\n               valueInQuoteAsset: '0.867'\n             }],\n    messageType: 'orderChange',\n    clientOrderId: 'abc-id'\n  }\n  ```\n\n  ### Triggered\n  This event is published when `Stop Limit` orders are triggered.\n\n  ```javscript\n  { orderId: 7903,\n    marketId: 'BTC-AUD',\n    side: 'Bid',\n    type: 'Limit',\n    openVolume: '1.2',\n    status: 'Placed',\n    triggerStatus: 'Triggered',\n    trades: [],\n    timestamp: '2019-04-08T20:41:41.857Z',\n    messageType: 'orderChange'\n  }\n```\n\n### Notes:\n\n  * `Fully Matched` and `Partially Matched` events also include a list of trades that are the result of trade execution for that specific instance.\n  * `Fully Matched` and `Partially Matched` events include the `valueInAssetQuote` attribute represents trade value that is price * amount\n  * In the case that two or more events are published by trading engine at the same time, only the last event\
    \ is published. For instance, in the case of a `Stop` order being triggered and matched at the same time, a single event is published.\n\n\n## Fund Transfer Events\n  These events are published when deposits or withdrawals of funds are requested by a user or approved by the system (and result in balance updates). The channel name used is `fundChange`.\n\n```javscript\n{\n  fundtransferId: 276811,\n  type: 'Deposit',\n  status: 'Complete',\n  timestamp: '2019-04-16T01:38:02.931Z',\n  amount: '0.001',\n  currency: 'BTC',\n  fee: '0',\n  messageType: 'fundChange'\n}\n```\n\nNote: The status of a withdraw request is `Pending Authorization` when it's first requested and before it becomes `Complete`.\n"
- name: fix_introduction
  x-displayName: FIX API Overview
  description: "\n## Introduction\nFIX (Financial Information eXchange) is a standard message protocol used to interact with trading systems for placing and canceling orders. The FIX interface is based on the FIX 4.4 specification.\n\nPlease contact the BTC Markets support team and complete the account verification process to gain secure access to the FIX interface.\n\n## FIX Interfaces\nBTC Markets offers the existing FIX order-entry interface and three new interfaces in preview. All four share the FIX 4.4 specification, session layer, authentication and data dictionary. Each preview interface has its own section below.\n\n| Interface | Purpose | Client sends | Server delivers | Endpoint |\n|---|:---|:---|:---|:---|\n| Existing FIX order entry | Place and cancel orders | Logon, order entry, cancel and status requests | Execution Reports for account activity, including orders placed via REST | tcp+ssl://fix.btcmarkets.net:443 |\n| [FIX Order Entry (Preview)](#tag/fix_order_entry) | Place\
    \ and cancel orders with lower round-trip latency | Same as existing FIX order entry | Execution Reports only for activity on the current FIX session | Dedicated, provided during onboarding |\n| [FIX Drop Copy (Preview)](#tag/fix_drop_copy) | Receive-only copy of all account activity | Logon only (plus session-level messages) | Execution Reports for all account activity, from any origin (REST or FIX) | Dedicated, provided during onboarding |\n| [FIX Market Data (Preview)](#tag/fix_market_data) | Real-time order book data | Logon and Market Data Requests | Order book snapshots and incremental updates | Dedicated, provided during onboarding |\n\nThe connectivity, endpoint, rate limit and maintenance details below describe the existing FIX order-entry interface.\n\n### Connectivity\nClients must establish a secure connection to the FIX gateway in order to establish a session.\n\n### Endpoint \ntcp+ssl://fix.btcmarkets.net:443\n\n### Rate Limit\nAll requests are limited to 600 calls per\
    \ 10 seconds per FIX session. An account can establish and maintain a single FIX session only.\n\n### FIX Maintenance\nThe FIX engine will go down on a daily basis at UTC time 17:00:00 for maintenance and updates.\n\nThe FIX engine will have a daily maintenance window between 5 p.m. UTC to 5:10 p.m. UTC. During this time, all sessions will be closed. Clients must establish a new connection and log on again. All sessions must have the sequence numbers reset to 1.\n\n\n## Authentication\nTo establish a FIX connection, an API key must be set up (using a similar process as required for the REST API). This will be the SenderCompID for messages sent by the Client.\n\nAuthentication will be verified at logon. The raw data element within the logon message must contain a valid signature, which will be validated by the FIX engine.\n\nThe prehash string for the signature input contains the following fields concatenated with an empty string:\n\n`seqNum + \"A\" + apiKey + timestamp`\n\n`timestamp`\
    \ is taken from the logon message SendingTime tag (converted to epoch value in milliseconds).\n\nThe following steps demonstrate how to convert the prehash string to a signature:\n\n``` javascript\n  const msg = seqNum+'A'+apiKey+timestamp\n  var buffer = Buffer.from(apiPrivateKey, 'base64');\n  var hmac = crypto.createHmac('sha512', buffer);\n  const signature = hmac.update(preHashString).digest('base64');\n```        \n\n\n### FIX Workflow Steps\n* Connection\n* Logon and Authentication\n* Synchronizing sequence numbers\n* Place or cancel orders\n\n## FIX Client Libraries\nIf you are starting to develop your FIX client application, the following code samples can be useful. These demonstrate authentication and the ability to place and cancel orders:\n\n* Java : https://github.com/ngin-io/fix-client-java\n\n* Node : https://github.com/ngin-io/fix-client-node\n        \n## FIX Naming Convention vs REST API\nBTC Markets has implemented common messaging and naming conventions used by other\
    \ crypto exchanges, while also ensuring compatibility with the REST API. The table below shows the FIX and corresponding REST API names.\n\n| FIX Name              | REST API       |\n|-----------------------|:---------------|\n| Symbol                | marketId       |\n| OrdType               | type           |\n| OrderQty              | amount         |\n| ClOrdID               | clientOrderId  |\n| SelfTradePrevention   | selfTrade      |\n| ExecInst              | postOnly       |\n| LeavesQty             | openAmount     |\n"
- name: fix_messages
  x-displayName: FIX Messages
  description: "## Overview\nAll messages have an attribute called `MsgType` which represents the type of message to be communicated with the FIX engine.\n\n## Messages From Client to Server\n\n| Message Type               | Identifier |\n|-----------------------------|:----------|\n| Logon                       | A         |\n| Heartbeat                   | 0         |\n| Test Request               | 1         |\n| Logout                      | 5         |\n| New Single Order            | D         |\n| Cancel Order                | F         |\n| Order Status                | H         |\n| Order Mass Cancel Request   | q         |\n\n## Messages From Server to Client\n\n| Message Type               | Identifier |\n|-----------------------------|:----------|\n| Logon                       | A         |\n| Heartbeat                   | 0         |\n| Test Request               | 1         |\n| Logout                      | 5         |\n| Order Execution Report      | 8         |\n| Order\
    \ Cancel Reject         | 9         |\n| Order Mass Cancel Report    | r         |\n| Business Message Reject     | j         |\n\n## Common Message Header\nAll messages must include the following header:\n\n| Tag | Name          | Description                                     |\n|-----|---------------|:------------------------------------------------|\n| 8   | BeginString   | Must be FIX.4.4                                 |\n| 9   | BodyLength    | Length of the message body in bytes             |\n| 35  | MsgType       | e.g. D                                          |\n| 49  | SenderCompID  | API key (similar API keys used for REST APIs)   |\n| 56  | TargetCompID  | Must be BTCM (for messages from the client)     |\n| 34  | MsgSeqNum     | FIX Sequence Number                             |\n| 52  | SendingTime   | Sender time                                     |\n| 10  | CheckSum      | FIX computed checksum                           |\n\n## Data Dictionary\n\n### Side\n\n| Value\
    \ | Description |\n|-------|:------------|\n| 1     | BUY         |\n| 2     | SELL        |\n\n### OrdType\n\n| Value | Description |\n|-------|:------------|\n| 1     | Market      |\n| 2     | Limit       |\n| 3     | Stop        |\n| 4     | Stop Limit  |\n\n### TimeInForce\n\n| Value | Description                  |\n|-------|:-----------------------------|\n| 1     | Good Till Cancel (GTC)       |\n| 3     | Immediate or Cancel (IOC)    |\n| 4     | Fill Or Kill (FOK)           |\n\n### ExecInst\n\n| Value | Description       |\n|-------|:------------------|\n| 6     | Post only order   |\n\n### SelfTradePrevention\n\n| Value | Description          |\n|-------|:---------------------|\n| P     | Prevent self trade   |\n| A     | Allow self trade     |\n\n### ExecType\n\n| Value | Description       |\n|-------|:------------------|\n| 0     | New               |\n| 4     | Canceled          |\n| 8     | Rejected          |\n| F     | Trade             |\n| I     | Order Status   \
    \   |\n| L     | Triggered Order   |\n\n### OrdStatus\n\n| Value | Description         |\n|-------|:--------------------|\n| 0     | New                 |\n| 1     | Partially Filled    |\n| 2     | Filled              |\n| 4     | Canceled            |\n| 8     | Rejected            |\n\n### OrdType\n\n| Value | Description   |\n|-------|:--------------|\n| 1     | Market        |\n| 2     | Limit         |\n| 3     | Stop          |\n| 4     | Stop Limit    |\n\n### OrdRejReason\n\n| Value | Description          |\n|-------|:---------------------|\n| 101   | INPUT_ERROR          |\n| 102   | AUTH_ERROR           |\n| 103   | SERVER_ERROR         |\n| 104   | THROTTLED            |\n| 105   | INSUFFICIENT_FUNDS   |\n| 99    | OTHER                |\n\n### CxlRejReason\n\n| Value | Description              |\n|-------|:-------------------------|\n| 0     | TOO_LATE_TO_CANCEL       |\n| 1     | UNKNOWN_ORDER            |\n| 3     | ORDER_IN_PENDING_CANCEL  |\n| 4     | ORDER_ALREADY_CANCELLED\
    \  |\n| 101   | INPUT_ERROR              |\n| 102   | AUTH_ERROR               |\n| 103   | SERVER_ERROR             |\n| 104   | THROTTLED                |\n| 99    | OTHER                    |\n        \n### MassCancelRequestType\n        \n| Value | Description                   |\n|-------|:------------------------------|\n| 1     | CANCEL_ORDERS_FOR_SYMBOL      |\n| 7     | CANCEL_ALL_ORDERS             |\n        \n### MassCancelResponse\n        \n| Value | Description                   |\n|-------|:------------------------------|\n| 0     | CANCEL_REQUEST_REJECTED       |\n| I     | CANCEL_REQUEST_INITIATED      |\n        \n### MassCancelRejectReason\n        \n| Value | Description          |\n|-------|:---------------------|\n| 99    | OTHER                |\n| 101   | INPUT_ERROR          |\n| 102   | AUTH_ERROR           |\n| 103   | SERVER_ERROR         |\n        \n### CancelOrdersOnDisconnect\n\n| Value | Description                                       |\n|-------|:--------------------------------------------------|\n\
    | 0     | No orders will be canceled on disconnect or logout |\n| 1     | Cancel all orders on disconnect only              |\n| 2     | Cancel all orders on logout only                  |\n| 3     | Cancel all orders on disconnect or logout         |\n\n### BusinessRejectReason\n\n| Value | Description |\n|-------|:------------|\n| 99    | OTHER       |\n\n\n\n## Logon (A)\n\nThe Logon message is sent by the Client to initiate a FIX session. Logon must be the first message immediately after the connection is established. Only one FIX session can be established per connection, and any additional Logon messages will be rejected. A corresponding Logon message will be returned to the Client. As with any other FIX message, the RawDataLength should precede the RawData.\n\n| Tag   | Name                       | Example Value | Description                                           |\n|-------|----------------------------|:--------------|:------------------------------------------------------|\n\
    | 98    | EncryptMethod              | 0             | Must be set to \"0\" (None). Encryption is not supported |\n| 108   | HeartBInt                  | 30            | Must be set to \"30\"                                   |\n| 95    | RawDataLength              | ...           | Size of RawData                                       |\n| 96    | RawData                    | 8f7e...4783   | Signature                                             |\n| 35002 | CancelOrdersOnDisconnect   | 0             | [Reference](#cancelordersondisconnect)                |\n\n\nA sample pretty printed FIX Logon message looks as follows:\n\n``` javascript\n  8=FIX.4.4\\u00019=207\\u000135=A\\u000134=1\\u000149=api-key\\u000152=20220825-00:56:36.854\\u000156=BTCM\\u000198=0\\u0001108=30\\u0001141=Y\\u000195=88\\u000196=cktgFTtk69umyx2n76JWo5RspF6Z898Op1yISR60tLUgqb4RtxH0WiOCLEAuqFC38RzIofWbfXs8oywWiijabc==\\u000135002=0\\u000110=015\\u0001\n``` \n\n\n## Logout (5)\nThe logout message is sent by the Client\
    \ or Server to close a session gracefully.\n\n## Heartbeat (0)\nHeartbeat messages can be sent by both the Client and Server if no messages have been sent for 30 seconds (or as agreed at Logon message request).\n\n| Tag  | Name       | Example Value | Description                                            |\n|------|------------|:--------------|:-------------------------------------------------------|\n| 112  | TestReqID  | TEST          | Echoed back if responding back to Test Request (1)     |\n\n## Test Request (1)\nTest messages can be sent by both the Client or Server.\n\n| Tag  | Name       | Example Value | Description                                            |\n|------|------------|:--------------|:-------------------------------------------------------|\n| 112  | TestReqID  | TEST          | Indicates a string that is expected to be echoed back in the next heartbeat |\n\n## New Single Order Request (D)\nNew single order messages can be sent by the Client to enter a new single\
    \ order.\n\n| Tag   | Name                  | Example Value | Required Y/N | Description                                                                 |\n|-------|-----------------------|:--------------|:-------------|:----------------------------------------------------------------------------|\n| 11    | ClOrdID               | order123      | Y            | Client order ID is a string field allowing up to 64 characters: a-z, A-Z, 0-9, and standard formats like UUID |\n| 55    | Symbol                | BTC-AUD       | Y            |                                                                            |\n| 40    | OrdType               | 2             | Y            | [Reference](#ordtype)                                                       |\n| 38    | OrderQty              | 1.1           | Y            | Order quantity                                                              |\n| 44    | Price                 | 8000          | N            | Limit price - required for\
    \ OrdType = 2 or 4                                 |\n| 99    | StopPx                | 9000          | N            | Stop price - required for OrdType = 3 or 4                                  |\n| 54    | Side                  | 1             | Y            | [Reference](#side)                                                          |\n| 59    | TimeInForce           | 1             | Y            | [Reference](#timeinforce)                                                   |\n| 18    | ExecInst              | 6             | N            | [Reference](#execinst) Defaults to not post only if not specified           |\n| 7928  | SelfTradePrevention   | P             | N            | [Reference](#selftradeprevention) Defaults to allow self trade if not specified |\n\n## Cancel Order Request (F)\nA cancel order request can be sent by the Client to cancel an existing order. Either the OrderID or the OrigClordID must be provided.\n\n| Tag  | Name        | Example Value | Description \
    \                                   |\n|------|-------------|:--------------|:-----------------------------------------------|\n| 37   | OrderID     | 123456        | Order ID for the original order (system generated) |\n| 41   | OrigClOrdID | order123      | Original client order ID                       |\n| 11   | ClOrdID     | cxl123        | Client Order ID of this cancel request         |\n\n## Order Mass Cancel Request (q)\nOrder Mass Cancel request can be sent by the Client to cancel all open orders for a given symbol or all open orders for the client account.\n\n| Tag  | Name                   | Example Value | Required Y/N | Description                                                   |\n|------|------------------------|:--------------|:-------------|:--------------------------------------------------------------|\n| 11   | ClOrdID                | order123      | Y            | Client Order ID to uniquely identify the mass cancel request  |\n| 530  | MassCancelRequestType\
    \  | 1             | Y            | [Reference](#masscancelrequesttype)                           |\n| 55   | Symbol                 | BTC-AUD       | N            | Identifies symbol associated with this request, required if MassCancelRequestType = 1 |\n\n## Order Status Request (H)\nThe order status request message can be sent by the Client to get the status of an order. Either the OrderID or the ClOrdID must be provided.\n\n| Tag  | Name     | Example Value | Description                                   |\n|------|----------|:--------------|:----------------------------------------------|\n| 11   | ClOrdID  | order123      | Client Order ID of the original order         |\n| 37   | OrderID  | orderxyz      | Order ID (system generated) of the original order |\n\n## Order Execution Report (8)\nThe order execution report message is sent by the Server to report the result of a request from the Client.\n\n| Tag  | Name         | Example Value | Description                           \
    \                                    |\n|------|--------------|:--------------|:--------------------------------------------------------------------------|\n| 11   | ClOrdID      | order123      | Client order ID                                                           |\n| 37   | OrderID      | orderxyz      | Order ID (system generated)                                               |\n| 150  | ExecType     | 0             | [Reference](#exectype)                                                    |\n| 39   | OrdStatus    | 0             | [Reference](#ordstatus)                                                   |\n| 55   | Symbol       | BTC-AUD       |                                                                           |\n| 54   | Side         | 1             | [Reference](#side)                                                        |\n| 40   | OrdType      | 2             | [Reference](#ordtype)                                                     |\n| 38   | OrderQty    \
    \ | 1.1           | Original order quantity. Only available for ExecType = I                   |\n| 44   | Price        | 8000          | Only available for ExecType = I                                           |\n| 32   | LastQty      | 0.2           | Last quantity traded. Only available for ExecType = F                      |\n| 31   | LastPx       | 100           | Last price traded. Only available for ExecType = F                         |\n| 17   | ExecID       | 98765         | Execution/Trade ID. Only available for ExecType = F                        |\n| 151  | LeavesQty    | 10            | Open order quantity                                                        |\n| 103  | OrdRejReason | 101           | [Reference](#ordrejreason) Only available for ExecType = 8                  |\n| 58   | Text         | Invalid market id | Free format reject reason text. Only available for ExecType = 8         |\n\n\n## Order Cancel Reject (9)\nThe order cancel reject message can be sent\
    \ by the Server to reject an order cancelation request from the Client. These messages can be sent if the order is already canceled, filled, or does not exist in the system.\n\n| Tag  | Name              | Example Value | Description                                                           |\n|------|-------------------|:--------------|:----------------------------------------------------------------------|\n| 37   | OrderID           | 123456        | Order ID for the original order (system generated)                    |\n| 41   | OrigClOrdID       | order123      | Original client order ID                                              |\n| 39   | OrdStatus         | 8             | Fixed value                                                           |\n| 102  | CxlRejReason      | 0             | [Reference](#cxlrejreason)                                            |\n| 434  | CxlRejResponseTo  | 1             | Response to the cancel request; Fixed value                        \
    \   |\n\n## Order Mass Cancel Report (r)\nThe order mass cancel report is sent by the Server in response to an Order Mass Cancel request. There can be situations where a previous order is not cancelled due to the asynchronous nature of the trading system. We strongly advise keeping track of individual order updates to confirm the cancellations.  \n\n| Tag  | Name                     | Example Value | Description                                                                 |\n|------|--------------------------|:--------------|:----------------------------------------------------------------------------|\n| 11   | ClOrdID                  | 123456        | Client Order ID for the mass cancel request                                 |\n| 530  | MassCancelRequestType    | 1             | [Reference](#masscancelrequesttype)                                         |\n| 531  | Mass Cancel Response     | I             | [Reference](#masscancelresponse)                                     \
    \       |\n| 532  | MassCancelRejectReason   | 102           | [Reference](#masscancelrejectreason), only available if Mass Cancel Response = '0' |\n\n## Business Message Reject (j)\nThe business message reject is sent by the Server when the message fulfils session-level rules, but gets rejected at the application-level. Note that standard FIX session-level reject messages (message type = '3') will be sent when incoming message violates standard FIX session rules  \n\n| Tag  | Name                  | Example Value | Description                                                                  |\n|------|-----------------------|:--------------|:-----------------------------------------------------------------------------|\n| 45   | RefSeqNum             | 102           | Message sequence num of rejected message                                     |\n| 372  | RefMsgType            | D             | Message Type of rejected message                                             |\n| 380  |\
    \ BusinessRejectReason  | 99            | [Reference](#businessrejectreason)                                           |\n| 58   | Text                  | Throttle limit exceeded (300 in 10000ms) | Indicates msgs per millisecond allowed before throttle kicks in |\n"
- name: fix_order_entry
  x-displayName: FIX Order Entry (Preview)
  description: '## Overview

    FIX Order Entry is a new, low-latency order-entry interface in the BTC Markets FIX offering. It is built for clients that place and cancel orders over FIX and want the lowest possible round-trip time between sending a request and receiving its Execution Report.


    FIX Order Entry uses the **same FIX 4.4 specification, messages and data dictionary** as the existing FIX order-entry interface documented under **FIX Messages**. It accepts the same requests and returns the same reports with identical field encodings, so if you already integrate with BTC Markets FIX for order entry there are no codec or message-parsing changes to make.


    > FIX Order Entry is currently in preview. Please contact the BTC Markets support team to request access and to receive the order-entry endpoint.


    ### Connectivity

    FIX Order Entry runs on a dedicated endpoint, separate from the existing FIX gateway, Drop Copy and Market Data. The support team will provide the endpoint during onboarding.


    ### Authentication

    Authentication is identical to the existing order-entry interface: the same API key is used as the `SenderCompID`, and the Logon (`A`) message must carry the same signature described under **FIX API Overview**.


    ### FIX Dictionary

    The FIX 4.4 data dictionary for FIX Order Entry is published at [https://github.com/BTCMarkets/fix-v2-codecs](https://github.com/BTCMarkets/fix-v2-codecs).


    ## How FIX Order Entry Differs From the Existing FIX Interface

    The two interfaces are the same on the wire. The differences are latency and the scope of the reports a session receives.


    ### Lower latency

    FIX Order Entry is optimised for latency and delivers a lower overall round trip, from the client''s request to the corresponding Execution Report, than the existing FIX interface.


    ### Session-scoped reports

    A FIX Order Entry session only receives Execution Reports and cancellation messages for orders placed and cancelled **on that same FIX session**. Activity from other channels is not reported. For example, orders placed or cancelled via the REST API, or via a different FIX session, and the trades resulting from them, are not delivered to the session.


    To receive all of an account''s order and trade activity regardless of where it originated, use [FIX Drop Copy](#tag/fix_drop_copy) alongside FIX Order Entry.


    ## Messages

    FIX Order Entry supports the full message set documented under **FIX Messages**: Logon (`A`), Heartbeat (`0`), Test Request (`1`), Logout (`5`), New Single Order (`D`), Cancel Order (`F`), Order Status (`H`) and Order Mass Cancel Request (`q`) from the client; and Order Execution Report (`8`), Order Cancel Reject (`9`), Order Mass Cancel Report (`r`) and Business Message Reject (`j`) from the server.


    Refer to the **FIX Messages** section for the full field-level definitions of each message and the shared data dictionary. They apply unchanged to FIX Order Entry.

    '
- name: fix_drop_copy
  x-displayName: FIX Drop Copy (Preview)
  description: '## Overview

    FIX Drop Copy is a new, receive-only addition to the BTC Markets FIX offering. It streams a real-time copy of an account''s order and trade activity over a FIX session, so you can monitor fills, cancellations and order state without placing any orders yourself.


    Drop Copy uses the **same FIX 4.4 specification, message formats and data dictionary** as the FIX order-entry interfaces, documented under **FIX Messages**. Execution Reports (`8`), Order Cancel Rejects (`9`) and every field encoding are identical, so if you already integrate with BTC Markets FIX for order entry there are no codec or message-parsing changes to make.


    > FIX Drop Copy is currently in preview. Please contact the BTC Markets support team to request access and to receive the drop-copy endpoint.


    ### Connectivity

    Drop Copy runs on a dedicated endpoint, separate from the order-entry gateways. The support team will provide the endpoint during onboarding.


    ### Authentication

    Authentication is identical to the order-entry interface: the same API key is used as the `SenderCompID`, and the Logon (`A`) message must carry the same signature described under **FIX API Overview**. The signed Logon is the only message a client needs to send.


    ### FIX Dictionary

    The FIX 4.4 data dictionary for FIX Drop Copy is published at [https://github.com/BTCMarkets/fix-v2-codecs](https://github.com/BTCMarkets/fix-v2-codecs).


    ## How Drop Copy Works

    Drop Copy is receive-only, and it reports all of an account''s activity regardless of where it originated.


    ### The client only sends a Logon

    A Drop Copy session is receive-only. After a successful Logon, the client is not expected to send any application messages — only the standard session-level messages (Heartbeat `0`, Test Request `1`, Logout `5`) are exchanged to keep the session alive.


    Order-entry application messages are not accepted on a Drop Copy session. Any attempt to enter or cancel orders — New Single Order (`D`), Cancel Order (`F`), Order Mass Cancel Request (`q`) or Order Status (`H`) — is rejected (for example, a New Single Order is answered with a rejected Execution Report). Use the FIX order-entry interface or the REST API to manage orders.


    ### Scope of delivered messages

    Drop Copy delivers **all account-level order, cancellation and trade activity, regardless of where it originated**. Orders and cancellations submitted via the REST API or any FIX session are all reported on the Drop Copy session. Trade Execution Reports are delivered even when the fill is against an order that has been resting in the orderbook since well before the Drop Copy session connected.


    ## Messages

    Drop Copy uses the same message definitions documented under **FIX Messages**. In practice a Drop Copy session only exchanges the following.


    ### Messages From Client to Server

    | Message Type | Identifier |

    |--------------|:----------|

    | Logon        | A         |

    | Heartbeat    | 0         |

    | Test Request| 1         |

    | Logout       | 5         |


    ### Messages From Server to Client

    | Message Type            | Identifier |

    |-------------------------|:----------|

    | Logon                   | A         |

    | Heartbeat               | 0         |

    | Test Request           | 1         |

    | Logout                  | 5         |

    | Order Execution Report  | 8         |

    | Order Cancel Reject     | 9         |

    | Business Message Reject | j         |


    Refer to the **FIX Messages** section for the full field-level definitions of each message and the shared data dictionary — they apply unchanged to Drop Copy.

    '
- name: fix_market_data
  x-displayName: FIX Market Data (Preview)
  description: '## Overview

    FIX Market Data is a new, subscription-based addition to the BTC Markets FIX offering. It streams real-time order book data for the markets you subscribe to over a FIX session, so you can maintain a live local copy of the book without polling the REST API. Like Drop Copy, it is receive-oriented: after Logon the only application message a client sends is the subscription request.


    Market Data uses the **same FIX 4.4 specification, session layer and data dictionary** as the order-entry and Drop Copy interfaces. If you already integrate with BTC Markets FIX, the session, Logon and authentication are unchanged — only the market-data application messages described below are added.


    > FIX Market Data is currently in preview. Please contact the BTC Markets support team to request access and to receive the market-data endpoint.


    ### Connectivity

    Market Data runs on a dedicated endpoint, separate from the order-entry and Drop Copy gateways. The support team will provide the endpoint during onboarding.


    ### Authentication

    Authentication is identical to the order-entry interface: the same API key is used as the `SenderCompID`, and the Logon (`A`) message must carry the same signature described under **FIX API Overview**.


    ### FIX Dictionary

    The machine-readable FIX 4.4 data dictionary covering these market-data messages is published at [https://github.com/BTCMarkets/fix-v2-codecs](https://github.com/BTCMarkets/fix-v2-codecs). The tables below describe the same messages field by field.


    ## How Market Data Works

    A market-data session follows a simple subscribe → snapshot → updates flow:


    1. **Subscribe.** After Logon, the client sends a Market Data Request (`V`) naming one or more symbols with a `SubscriptionRequestType` of `1` (Snapshot + Updates). Each request carries a client-assigned `MDReqID` that is echoed back on every response for that subscription.

    2. **Snapshot.** For each subscribed symbol the server sends one Market Data Snapshot / Full Refresh (`W`) — the complete current order book, both sides.

    3. **Updates.** The server then streams Market Data Incremental Refresh (`X`) messages carrying only the price levels that changed since the snapshot. Apply these to the book delivered in step 2 to keep a live copy. Both the snapshot (`W`) and each update (`X`) carry a book sequence in `RptSeq` (`83`); apply only updates whose `RptSeq` is greater than the snapshot''s to stitch the live book onto it (see [Book sequence](#book-sequence)).

    4. **Unsubscribe.** To stop a stream, the client sends a Market Data Request (`V`) with `SubscriptionRequestType` `2` (Disable previous snapshot / Unsubscribe) for the same symbol(s). The server identifies the streams to terminate by the `Symbol`(s) in `NoRelatedSym`, not by `MDReqID`. A valid `MDReqID` is still required on the request, but it does not need to match the `MDReqID` used on the original subscribe.


    If a request cannot be satisfied (unknown symbol, unsupported subscription type, and so on) the server replies with a Market Data Request Reject (`Y`).


    ### Book sides

    Book side is not client-selectable — every snapshot and update carries both bids (`MDEntryType` `0`) and offers (`MDEntryType` `1`). There is no per-side subscription.


    ### Incremental updates and the update action

    `MDUpdateAction` (`279`) is the authoritative instruction for how to apply each level — key your book update on it, not on the size:


    - **`CHANGE` (`1`)** — upsert the level: insert it at that price if you have none, otherwise replace the size at that price. Every addition and size change is delivered as `CHANGE`. The feed does not distinguish a brand-new level from a changed one, so `NEW` (`0`), although defined by the FIX dictionary, is not emitted on this interface.

    - **`DELETE` (`2`)** — remove the level at that price. On a `DELETE` the accompanying `MDEntrySize` is `0`, but treat `MDUpdateAction` — not the size — as the signal to remove the level.


    ### Book checksum

    Every Incremental Refresh (`X`) carries a `BookChecksum` (`7929`): a value computed over the resulting order book that a client can recompute against its own reconstructed book to confirm the two are in sync. Snapshots (`W`) are complete and carry no checksum. The exact checksum algorithm will be documented separately.


    ### Book sequence

    Every Snapshot (`W`) and Incremental Refresh (`X`) carries a book sequence in `RptSeq` (`83`) — a value that increases monotonically per order book as its state advances. Use it to align the two message types:


    - The `RptSeq` on a Snapshot (`W`) is the sequence the book was captured at.

    - The `RptSeq` on an Incremental Refresh (`X`) is the sequence of the book after that update is applied.

    - Apply an `X` only when its `RptSeq` is greater than the last sequence you have applied for that book; discard any `X` whose `RptSeq` is less than or equal to the snapshot''s (it is already reflected in the snapshot).


    `RptSeq` is scoped to a single order book (see the [Incremental Refresh scope note](#market-data-incremental-refresh-x)); track it per symbol. The value increases monotonically but is **not** a contiguous, one-per-message counter — it advances by varying amounts. Use it only to order and align updates against the snapshot. It cannot be used to detect message loss by expecting consecutive values, unlike venues that increment `RptSeq` by one per message.


    > `RptSeq` (`83`) is a 64-bit value. Although FIX conventionally types tag 83 as a 32-bit sequence number, this feed can emit values beyond the 32-bit range — parse it as a 64-bit integer.


    > Trade prints (`MDEntryType` `2`) are reserved for a future market-data stream and are not delivered on this interface yet. Today only bid/offer book entries are streamed.


    ## Messages

    Market Data adds the following application messages to the shared FIX 4.4 message set.


    ### Messages From Client to Server

    | Message Type        | Identifier |

    |---------------------|:----------|

    | Logon               | A         |

    | Heartbeat           | 0         |

    | Test Request       | 1         |

    | Logout              | 5         |

    | Market Data Request | V         |


    ### Messages From Server to Client

    | Message Type                        | Identifier |

    |-------------------------------------|:----------|

    | Logon                               | A         |

    | Heartbeat                           | 0         |

    | Test Request                       | 1         |

    | Logout                              | 5         |

    | Market Data Snapshot / Full Refresh | W         |

    | Market Data Incremental Refresh     | X         |

    | Market Data Request Reject          | Y         |

    | Business Message Reject             | j         |


    ## Market Data Request (V)

    Sent by the client to subscribe to (or unsubscribe from) the order book for one or more symbols.


    | Tag | Name                     | Example Value | Required Y/N | Description                                          |

    |-----|--------------------------|:--------------|:-------------|:-----------------------------------------------------|

    | 262 | MDReqID                  | req-1         | Y            | Client-assigned request ID, echoed on all responses. On an unsubscribe (`SubscriptionRequestType` `2`) it is required but need not match the original subscribe — streams are identified by `Symbol` |

    | 263 | SubscriptionRequestType  | 1             | Y            | [Reference](#subscriptionrequesttype)                |

    | 146 | NoRelatedSym             | 1             | Y            | Number of symbols in the request                     |

    | 55  | Symbol                   | BTC-AUD       | Y            | Repeated once per `NoRelatedSym` entry               |


    ## Market Data Snapshot / Full Refresh (W)

    Sent by the server, once per subscribed symbol, immediately after a subscription. Carries the complete current order book for the symbol. `NoMDEntries` (`268`) is a repeating group; the per-level fields below repeat once per level.


    | Tag | Name        | Example Value | Description                                    |

    |-----|-------------|:--------------|:-----------------------------------------------|

    | 262 | MDReqID     | req-1         | Echoes the subscription''s request ID           |

    | 55  | Symbol      | BTC-AUD       |                                                |

    | 83  | RptSeq      | 1789795809485000 | Book sequence this snapshot was captured at. [See above](#book-sequence) |

    | 268 | NoMDEntries | 50            | Number of book levels that follow              |

    | 269 | MDEntryType | 0             | Per level. [Reference](#mdentrytype)           |

    | 270 | MDEntryPx   | 61179.8       | Per level. Price                               |

    | 271 | MDEntrySize | 1.2           | Per level. Size at the price level             |

    | 273 | MDEntryTime | 20:54:27.632  | Per level. Book timestamp (optional)           |


    ## Market Data Incremental Refresh (X)

    Sent by the server to deliver the levels that changed since the snapshot. Apply each entry to your local book using its `MDUpdateAction`. `NoMDEntries` (`268`) is a repeating group; the per-level fields below repeat once per changed level.


    Each `X` message delivers updates for a single order book. All levels within it share the same `Symbol` (`55`), and the root `BookChecksum` (`7929`) is that symbol''s book checksum after the update is applied. When subscribed to multiple symbols, you receive a separate `X` per symbol — scope your checksum verification to the book identified by the entries'' `Symbol`.


    | Tag  | Name           | Example Value | Description                                                  |

    |------|----------------|:--------------|:-------------------------------------------------------------|

    | 262  | MDReqID        | req-1         | Echoes the subscription''s request ID                         |

    | 7929 | BookChecksum   | 2855026665    | Checksum of the resulting book. [See above](#book-checksum)  |

    | 83   | RptSeq         | 1789795809485000 | Book sequence after this update is applied. [See above](#book-sequence) |

    | 268  | NoMDEntries    | 2             | Number of changed levels that follow                         |

    | 279  | MDUpdateAction | 1             | Per level. [Reference](#mdupdateaction)                      |

    | 269  | MDEntryType    | 0             | Per level. [Reference](#mdentrytype)                         |

    | 55   | Symbol         | BTC-AUD       | Per level                                                    |

    | 270  | MDEntryPx      | 61179.8       | Per level. Price                                             |

    | 271  | MDEntrySize    | 1.2           | Per level. New size at the level; `0` accompanies a `DELETE` — see [MDUpdateAction](#mdupdateaction) |

    | 273  | MDEntryTime    | 20:54:27.632  | Per level. Update timestamp (optional)                       |


    ## Market Data Request Reject (Y)

    Sent by the server when a Market Data Request cannot be satisfied.


    | Tag | Name                   | Example Value  | Description                          |

    |-----|------------------------|:---------------|:-------------------------------------|

    | 262 | MDReqID                | req-1          | Echoes the rejected request''s ID     |

    | 281 | MDRequestRejectReason  | 0              | [Reference](#mdrequestrejectreason)  |

    | 58  | Text                   | Unknown symbol | Free-format reject reason text       |


    ## Data Dictionary


    ### SubscriptionRequestType


    Only `1` (subscribe) and `2` (unsubscribe) are supported. A one-off book snapshot is served by the REST orderbook endpoint rather than over FIX.


    | Value | Description                                                                 |

    |-------|:----------------------------------------------------------------------------|

    | 0     | Snapshot only — not supported; rejected with `UNSUPPORTED_SUBSCRIPTION_REQUESTTYPE` |

    | 1     | Snapshot + Updates (subscribe)                                              |

    | 2     | Disable previous snapshot (unsubscribe)                                     |


    ### MDEntryType


    | Value | Description                     |

    |-------|:--------------------------------|

    | 0     | Bid                             |

    | 1     | Offer                           |

    | 2     | Trade (reserved for future use) |


    ### MDUpdateAction


    | Value | Description                                                       |

    |-------|:------------------------------------------------------------------|

    | 0     | New — defined by FIX; not emitted on this feed (additions arrive as Change) |

    | 1     | Change (upsert)                                                   |

    | 2     | Delete                                                            |


    ### MDRequestRejectReason


    | Value | Description                            |

    |-------|:---------------------------------------|

    | 0     | Unknown symbol                         |

    | 3     | Auth error                             |

    | 4     | Unsupported subscription request type  |

    | 8     | Unsupported MD entry type              |

    | A     | Input error                            |

    | B     | System error                           |


    Refer to the **FIX Messages** section for the shared session-level messages (Logon, Heartbeat, Test Request, Logout), Business Message Reject (`j`), and the common message header — they apply unchanged to Market Data.

    '
