  # Error Handling

  By default, all successful requests result in HTTP `200` status and with the appropriate entity being returned.

  If any issues occur in processing the request, then a response code and a body containing a JSON message with more information about the underlying problem will be returned.

  For instance, placing an order with an invalid amount (e.g. too low) will result in a HTTP 400 error and a response body with the following information:

  `{"code":"InvalidOrderAmount", "message":"invalid order amount"}`

  We would encourage client app developers to use appropriate HTTP frameworks/libraries that allow them to capture the body of the response for the handling of errors.

  ## HTTP Status Codes

  The following HTTP status codes are supported. We make our best effort to send one of the following responses in any situation.


  | HTTP response       |  Description                     |
  |------------|:--------------------------------|
  | 200 - OK       | The HTTP request was successful. |
  | 400 - Bad Request     | The request failed due to a syntax error or is missing a required parameter.   |
  | 401 - Unauthorized       | Invalid API key or message signature generation issue |
  | 403 - Forbidden       | You do not have access to the requested resource. |
  | 404 - Not Found       | The requested resource was not found.  |
  | 429 - Too Many Requests       | You have exceeded throttle. |
  | 500 - Internal Server Error  | We failed to process your request due to a server problem.  |
  | 502 - Bad Gateway  | We are unable to process your request at this time due to technical issues.|
  | 503 - Service Unavailable  | Exchange is down or under maintenance |

  ## API Error Codes
   While handling HTTP status codes covers the requirements for most cases and client apps, there are situations where having a machine-readable and specific error code would help to handle specific cases more appropriately.

   For instance, when an account runs out of funds, calling a "placeOrder" API would result in an HTTP response code of 400 and an error message of "Insufficient funds". A client app may categorize all HTTP 400s as an indication of an issue and halt running or log the issue for a person to investigate and fix. However, some apps may have application logic specifically to deal with the issue of running out of funds. In this case, the app would parse the response text "Insufficient funds" and determine that it needs to make a deposit.

   Using the text message to make that decision might be difficult given that the text requires parsing. Additionally, if the text message is updated in the future (e.g. updated to "Insufficient funds in your ETH wallet") it may break the client application logic.

   As a result, an additional error code is provided (along with the `message`) inside the body of the HTTP response that can be used to handle specific situations programmatically.

   Below is a sample of such error codes:

   `{"code":"IncorrectDecimalPoints","message":"incorrect number of decimal points for price"}`

   Please refer to this section for a full list of errors: [**Full list of error codes**](#tag/ErrorCodes)

   We ensure that those error codes remain the same for the lifetime of the API. However, the text message that comes with errors may change.

   Also, some of the generic codes (e.g. BadRequest) may be changed to be specific codes (e.g. InvalidAmount) in the future. This change will not occur in the opposite direction (i.e specific to generic code).


   # Authentication

    ## Generate API key
    Before you begin, please make sure to generate API keys on the website. API keys come with permission for each area (e.g. trading, account, and fundtransfer).

    ## Authentication Parameters
    In order to authenticate your request, the following parameters are required:
    * API key
    * API private key
    * HTTP method: `POST`,  `GET` or `DELETE`
    * Current timestamp in millisecond (you check server time by calling API `/v3/time` )
    * Path of the request (with no query string)

    ## Authentication Process
    Use the following steps:
    * Build a string message: `method + path + timestamp + data`.
    * Sign the message using `Hmac512` algorithm.
    * Add the following HTTP headers: `BM-AUTH-APIKEY`, `BM-AUTH-TIMESTAMP`, and `BM-AUTH-SIGNATURE`.


    ## Build Message Signature
    The message to sign is a string concatenation of the HTTP method, API path, timestamp, and post data.

    The following code sample builds the message for authenticating for `/v3/reports` API using HTTP `POST`.

    ```Javascript
      var timestamp = Date.now();
      var path = '/v3/reports';
      var data = JSON.stringify({type:"TransactionReport",format:"json"});
      var message =  "POST" + path + timestamp + data;
    ```

    * Replace `POST` with `GET` or `DELETE` for `GET/DELETE` APIs.
    * For `GET` and `DELETE` requests the data portion of the message has no value; hence, it is not added to the message for signing.


    ## Sign the Message
    The following code sample signs the message for authentication.

    ```Javascript
      var buffer = Buffer.from(apiPrivateKey, 'base64');
      var hmac = crypto.createHmac('sha512', buffer);
      var signature = hmac.update(message).digest('base64');
    ```

    ## Set HTTP Headers
    The following code sample sets HTTP headers for authentication.

    ```Javascript
      var headers = {
        "Accept": "application/json",
        'Content-Length': Buffer.byteLength(data),
        "Content-Type": "application/json",
        "BM-AUTH-APIKEY": apiKey,
        "BM-AUTH-TIMESTAMP": timestamp,
        "BM-AUTH-SIGNATURE": signature
      };
    ```

    ## Sending HTTP Request
    The following code sample sends HTTP request.

    ```Javascript
    var post_options = {
    		host: baseUrl,
    		path: path,
    		method: 'POST',
    		headers: headers
    };
    var post_req = https.request(post_options, function(res) {
    	res.on('data', function (chunk) {
    		console.log('Http Response Code: ' + res.statusCode);
    		console.log('Response: ' + chunk);
    	});
    });
    post_req.write(data);
    post_req.end();
    ```

   # Pagination
    API v3 uses cursor-based pagination. This allows users to retrieve a specified number of records before or after a given number.

   ## Pagination Parameters

   APIs with support for pagination will return two additional HTTP headers for each request.
   * `BM-BEFORE`
   * `BM-AFTER`

   Then for those APIs, the following query parameters can be passed to handle pagination.

    | Name       |  Mandatory |  Description                     | 
    |------------|:----------:|:---------------------------------|
    | limit      |  no        |  Specifies how many items to return any number between 1 and 200  | 
    | before     |  no        |  Return items before given cursor  | 
    | after      |  no        |  Return items after given cursor  | 


   ## Pagination Process
   Use the following steps:
   1. Call the API with no query string params (you can specify the `limit`).
   2. Parse the HTTP response and extract the `BM_BEFORE` and `BM-AFTER` HTTP headers.
   3. If you need to retrieve older records, then pass `before=1234567` as query string with `1234567` being the value of HTTP header `BM-BEFORE`.
   4. If you need to retrieve newer records, then pass `after=123589` as query string with `123589` being the value of HTTP header `BM-AFTER`.
   5. Repeat from step 2.


    # Batch Processing

    Batch processing is supported for order placement, cancellation, and retrieval APIs. This gives more flexibility to traders and market makers for implementing different trading strategies.

    Batch requests are not considered atomic actions so each individual item inside the request is handled separately to ensure that an individual response is present for each request.

    One use case for batch processing is canceling an existing order and placing a new order with different attributes in a single HTTP call.

    Error handling for batch requests is similar to standard REST APIs with the exception that some of the error messages are no longer returned as HTTP status.

    For instance, when placing a new order, the following two error messages might be returned as a result of an invalid request:

    | Request       |  HTTP Status                 |
    |------------|:------------------------|
    | using price:"12.32abc"      |  HTTP 400 - invalid due to invalid price  |
    | placing order with insufficient fund     |  HTTP 400 - insufficient fund   |

    However, if you are placing a batch request of multiple order placements, when the content of the batch is validated, each individual request returns an error message inside the response body; hence the above errors do not result in HTTP 400. Instead, you should parse the response body to determine which requests were successful.

    Please refer to the [**Batch Order Placement**](#tag/Batch-Order-APIs) section for more information about how to handle the response body and errors for batch requests.

