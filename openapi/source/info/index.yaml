description: |
  # Introduction
    Welcome to BTC Markets API v3.

    ## Overview

    API v3 focuses on improving the experience for market markers, traders, and institutions, while covering all functionality currently provided via API v1 and v2. 
    
    It also offers significant improvements compared to previous API generations, including:

    

    | Improvement       |  Description              |
    |------------|:--------------------------------|
    | Compatibility with common REST API guidelines     | Easier to develop apps using standard libraries in any programming language |
    | Batch processing     |  Allows traders to combine multiple order placements and cancellations in a single HTTP request  |
    | Support for ClientOrderId     |  Allows traders to use their internal order ID hence better tracking of orders |
    | Simple and flexible APIs     | e.g. no need to make multiple API calls per market. A single call orders API returns open or historical orders.  |
    | Using HTTP status code for error handling     |     |
    | Easier pagination     |    |
    | New features     |  e.g. reports API, full orderbook data, multiple market tickers etc.  |
    | Standard data formats    |  e.g. amount as string, date/time as ISO 8601, etc. |
    | Better documentation    |  |

