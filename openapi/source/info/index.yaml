    # General Notes

    ### API Endpoint

    Base URL for all public and private APIs: https://api.btcmarkets.net

    The path for all APIs starts with `/v3`. For instance, the `time` API would be accessed via `https://api.btcmarkets.net/v3/time`.

      
    ### Request/response Format

    All requests and responses use `application/json` content type for all APIs.

    ### Date/time Format

    All APIs return date/time format in ISO 8601 with microsecond precision. Sample time returned: `2019-08-20T06:22:11.123456Z`.

    ### Number Format
    Unless specified, all amounts are formatted as `string`. For instance when placing a new order, pass `"1.45"` as the amount to buy 1.45 of `LTC`.

    At this stage, we support up to eight digits of decimal points when processing orders, trades, and transfers.

    Every market has a configuration for the number of decimal points used for pricing. For instance, for the `BAT-AUD` market you can specify up to four decimal points for `price` and for `amount` you can specify up to eight decimal points.
    Please refer to the `/v3/markets` API for more information.

    ### Sort Order
    By default, all lists are sorted in descending order, meaning the most recent records appear first in the list.

    ### Null Values
    Data objects returned by the HTTP response will not include attributes with null values.
    For instance, if you are not using clientOrderId for placing orders, then the data object returned by the HTTP response won't include it.

    APIs defined in this document have sample response format. In some cases, there is also an option to view the list of all possible attributes (from the right panel).

    ### Record IDs
    Records generated by the exchange will have IDs generated and represented in `string` format.

    At this stage, some of the record IDs generated by the exchange might have numbers only; however, we can't guarantee that they will continue to use numbers only as we continue to change our underlying systems.

    Therefore, we recommend that all client apps use string format to represent record IDs in order to avoid bugs at a later stage.

    ### Rate Limits
    Each API is throttled individually. All APIs are rate limited, and we currently measure rates over 10 second intervals. 
    
    For public APIs (e.g. get orderbook, ticker, etc.), the rate limit is tied to the client IP address. For private APIs (e.g. place order, cancel order, etc), the rate limit is tied to the account that created the API key.
    
    The default rate limit (unless otherwise specified) for public and private APIs is up to `150 calls per 10 seconds`. 
    
    There are exceptions to this rule as per below:

    | Name       |  API       | Limit              |
    |------------|:-----------|:---------------------|
    | Order placement API | /v3/orders POST     | 50 calls per 10 seconds |
    | Replace order API | /v3/orders/{id} PUT     | 50 calls per 10 seconds |
    | Batch order API | /v3/batchorders POST     | 10 calls per 10 seconds |
    | Batch market orderbook/ticker APIs | /v3/markets/orderbooks GET     | 30 calls per 10 seconds |
    | Withdraw request API | /v3/withdrawals POST     | 20 calls per 10 seconds |

    
    Note: A single batch order API can include up to 10 individual place or cancel order requests. Also, the batch market orderbook API allows you to retrieve orderbook for multiple markets in a single call.

    #### Rate Limit Response Headers

    Every rate limited API returns the following response headers. Header names are case insensitive.

    | Header       |  Description              |
    |------------|:--------------------------------|
    | `x-ratelimit-limit` | Number of calls allowed within a single rate limit window. |
    | `x-ratelimit-remaining` | Number of calls still available in the current window. |
    | `x-ratelimit-reset` | Unix time in seconds at which the current window ends. |

    Rate limits use a fixed 10 second window. The quota is not replenished gradually: `x-ratelimit-remaining` decreases as calls are made, and at the time reported by `x-ratelimit-reset` the current window ends and the full `x-ratelimit-limit` quota becomes available again.

    Requests rejected with HTTP status `429 - Too Many Requests` also include these headers, so `x-ratelimit-reset` indicates when the request can be retried.



    ### HTTP Status
    All APIs return commonly used HTTP statuses (e.g. 400, 401, 403, etc.) for errors and HTTP status 200 for a successful response.


