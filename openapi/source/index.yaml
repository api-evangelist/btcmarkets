tags:
    - name: order_status
      x-displayName: Order Status
      description: |
          An order can have any of the following statuses
          - `Accepted`: The order has been accepted by the trading platform.
          - `Placed`: The order has been submitted to the orderbook and appropriate funds are locked.
          - `Partially Matched`: The order has been partially matched.
          - `Fully Matched`: The order has been fully matched.
          - `Cancelled`: The order has been canceled and is no longer in the orderbook.
          - `Partially Cancelled`: The order has been canceled after being partially executed.
          - `Failed`: The order failed due to issues; for example, insufficient funds.

          Some of those statuses are considered final. Hence, the order can no longer be changed.

    - name: OrderTypes
      x-displayName: Order Types
      description: |
          The following order types are supported:
          - Limit
          - Market
          - Stop Limit
          - Stop
          - Take Profit


    - name: StopOrders
      x-displayName: Stop Orders
      description: |
          In general, stop orders stay in the orderbook and are only activated once the trigger price of the order is reached by the market. Depending on the type, upon triggering the order will be placed in the orderbook as a Limit or Market order that will then execute as normal.
          - For Stop Limit orders, the order type attribute will be "Stop Limit" and an additional field triggerPrice must be supplied.
          - For Stop orders, the order type attribute will be "Stop" and an additional field triggerPrice must be supplied with the same number conversion as price. When triggerPrice is reached, a market order will be executed.
          - For Take Profit orders, the order type attribute will be "Take Profit" and an additional field triggerPrice must be supplied with the same number conversion as price. When triggerPrice is reached, a market order will be executed.
          - For both Stop orders and Take Profit orders (depending on existing orders in the orderbook and market price at the time of triggering) they will be executed similar to Market orders.


    - name: ClientOrderId
      x-displayName: Client Order ID
      description: |
        `clientOrderId` is an optional parameter that can be set by the client applications to track orders using their internal order management system. `clientOrderId` is a string field between 1 to 64 with the following characters allowed:
           `a-z, A-Z, 0-9, -` allowing standard formats like UUID.

           We have tried to distinguish between the exchange `orderId` and `clientOrderId` returning both attributes while also allowing users to retrieve orders based on both attributes. Hence, APIs like `/v3/orders/{id}` use `id` to demonstrate that either the `orderId` or `clientOrderId` can be passed.

          `clientOrderId` is optional for normal order placement. However, it is mandatory if you decide to use batch order placement.


    - name: Timeinforce
      x-displayName: Time in Force
      description: |
       `timeInForce` option allows traders to control order lifetime with the following possible values.
       * `GTC`: good till canceled (the default value if not specified)
       * `IOC`: immediate or cancel. The order should be canceled immediately after being placed in the orderbook. The order may be matched against existing orders as part of the initial placement in the orderbook, but any volume that is is left from trade matching will be canceled immediately after placement. Therefore, possible results of an order with `IOC` option will be either `Fully Matched`, `Partially Matched`, `Cancelled` or `Partially Cancelled`.
       * `FOK`: fill or kill. The order is canceled if it's not executed fully at the time of placement. Possible results of an order with `FOK` option will be either `Fully Matched` or `Cancelled` immediately.

       Note: When `postOnly` option is set to `true` then the only possible value for `timeInForce` is `GTC` or do not pass any value for timeInForce.


    - name: TargetAmount
      x-displayName: Desired Target Amount
      description: |
       This is an optional parameter that allows traders to instruct the system to `sell` (or `buy`) as many numbers of `instrument` as possible
       so that the `targetAmount` is reached. For example- as a trader, I'd like to receive $100 (the target amount) by selling as many of my `XRPs` (the actual volume is determined by the system at the time of placing the order) as I can.  The system then makes the best effort to determine the total volume of `XRP` that is needed to sell in order to generate $100, considering all trading fees and partial order match, etc.
       This feature eliminates the need for traders to calculate how many XRPs are needed before placing an order, which might be a particularly difficult task when the market is moving quickly.
       This option also works for `Bid` orders with the use case being: I'd like to spend a maximum of $100 on buying `LTC` and the system determines the total volume that I can purchase considering all fees.
       `targetAmount` option is only applicable to `Market` orders.


       Please note that `price` and `volume` are not required when using `targetAmount`.


    - name: PostOnly
      x-displayName: Post Only Orders
      description: |
       `postOnly` is an optional boolean flag with true/false value. The default is false for all new orders. When this option is set to `true`, it means the order should only be posted to the orderbook if it does not result in any trades at the time of placement.  If any part of the order results in trade execution, the order will be canceled. Please note: once the order is accepted as part of the initial placement, then it may execute at any later time depending on the market price movements. The option is only applied for the time of placement.
       The `postOnly` option is only applicable to `Limit` orders.
        This option is mainly useful for market makers and liquidity providers.

    - name: SelfTrade
      x-displayName: Self Trade Prevention
      description: |
       The `selfTrade` option allows traders to control the possibility of their own orders executing against each other. For instance, if you already have an order in the orderbook to buy 100 `XRP` for the price of 0.50 and then place a new order to sell 100 `XRP` with the same price of 0.50, the new sell order will be canceled immediately and won't be submitted to the orderbook. The existing order (the buy order for 100 XRP) will continue to stay in the orderbook and will work as normal.
       The same is true also when the new order has the potential to match existing orders partially. So, using the previous example (your existing buy order of 100 `XRP`), if you place a new sell order with the `selfTrade` option to sell 200 `XRP` (given that 100 of those `XRP` will potentially match with an existing order that does not belong to you) then again the entire new sell order will be canceled immediately due to the `selfTrade` option.
       Please also note that this option is only checked once at the time of order arrival. If the order stays in the orderbook, then this option is not applicable anymore.
       
       Possible values for the `selfTrade` option are:
       - `A`: represents Allowed and means that self trade is allowed. This is the default behavior if `selfTrade` is not specified.
       - `P`: represents Prevented and means that self trade is prevented

    - name: market_status
      x-displayName: Market Status
      description: |
          Our trading engine uses a number of statuses to assist API clients as they manage their trading business logic. These statuses also open orders during scheduled maintenance and unforeseen service downtime. 

          The market status list covers whether the market is operational, the type of orders that can be placed, whether open orders can be cancelled, and whether any order matching can occur.

          

          Market Status Options:
          - `Offline`: The market is currently offline and order placement is not available at this time.
          - `Cancel Only`: This market currently allows cancelling existing orders only. Order placement is temporarily suspended.
          - `Post Only`: The market currently only accepts new orders with postOnly flag set to true. Orders will be placed in the orderbook but no order match will occur.
          - `Limit Only`: This market currently accepts limit orders only.
          - `Online`: The market is operating normally. All order types may be submitted and any matching can occur.

