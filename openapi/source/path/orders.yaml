/v3/orders:
    post:
        tags:
            - Order Placement APIs
        summary: Place new Order
        description: This API is used to place a new order. Some of the parameters are mandatory as specified below.
                      The right panel presents the default response with primary attributes. You can also select from the drop down to see an order response with all possible order attributes.
        requestBody:
            content:
                application/json:
                    schema:
                        allOf:
                            - description: Place new order
                              title: New order request
                            - $ref: "#/components/schemas/PlaceOrderRequest"
                    examples:
                        bid:
                            summary: new order example
                            value: {"marketId": "BTC-AUD", "price":"100.12","amount":"1.034","type":"Limit","side":"Bid"}
        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        schema:
                            $ref: "#/components/schemas/Order"
                        examples:
                            basic:
                                $ref: "#/components/examples/BasicOrderExample"
                            allAttributes:
                                $ref: "#/components/examples/AllOrderExample"

            "400":
              content:
                'application/json':
                  examples:
                    missingParam:
                      summary: missing clientOrderId
                      value: {"code":"InvalidMarketId","message":"invalid marketId"}
            "401":
              description: Not Authorized
            "403":
              description: Forbidden

        x-code-samples:
          - lang: "Javascript"
            source: |
              const crypto = require('crypto');
              const https = require('https');

              const apiKey = "add api key here";
              const privateKey = "add private key here";

              const placeOrderDataObj = {marketId: 'XRP-AUD',price: '0.34', amount:"1.0", side: "Bid", type: "Limit" };
              const data = JSON.stringify(placeOrderDataObj);
              const path = '/v3/orders';

              const now = Date.now();
              const message =  "POST" + path + now + data;

              var buffer = Buffer.from(privateKey, 'base64');
              var hmac = crypto.createHmac('sha512', buffer);
              const signature = hmac.update(message).digest('base64');

              const headers = {
              		"Accept": "application/json",
              		'Content-Length': Buffer.byteLength(data),
              		"Content-Type": "application/json",
              		"BM-AUTH-APIKEY": apiKey,
              		"BM-AUTH-TIMESTAMP": now,
              		"BM-AUTH-SIGNATURE": signature
              };
              var postOptions = {host: "api.btcmarkets.net", path: path, method: 'POST', headers: headers};
              var postReq = https.request(postOptions, function(res) {
              	res.on('data', function (chunk) {
              		console.log('Http Response Code: ' + res.statusCode);
              		console.log('Response: ' + chunk);
              	});
              });

              postReq.write(data);
              postReq.end();


    get:
        summary: List Orders
        description: Returns an array of historical orders or open orders only.
            All query string parameters are optional, so by default and when no query parameter is provided, this API retrieves open orders only for all markets.
           This API supports pagination only when retrieving all orders `status=all`. When sending using `status=open`, all open orders are returned and with no pagination.
        tags:
            - Order Placement APIs
        operationId: listOrders
        parameters:
            - name: marketId
              in: query
              required: false
              description: by default orders for all markets are returned. Specify a marketId for filtering.
              schema:
                  type: string
              example: ETH-AUD
            - name: before
              in: query
              required: false
              description: This is part of the pagination parameters.
              schema:
                  type: integer
                  format: int64
              example: 78234976
            - name: after
              in: query
              required: false
              description: This is part of the pagination parameters.
              schema:
                  type: integer
                  format: int64
              example: 78234876
            - name: limit
              in: query
              description: This is part of the pagination parameters.
              required: false
              schema:
                  type: integer
                  format: int32
              example: 50
            - name: status
              in: query
              description: returns orders with open status or all statuses
              required: false
              schema:
                  type: string
                  enum: [open, all]
        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        examples:
                            basic:
                                $ref: "#/components/examples/BasicOrderExample"

    delete:
        summary: Cancel Open Orders
        tags:
            - Order Placement APIs
        operationId: cancelOrders
        description: Cancels all open orders for all markets or optionally for a given list of marketIds only.
        parameters:
            - name: marketId
              in: query
              required: false
              description: restricts cancellation for those given marketIds only. Can be provided in the form of `marketId=BTC-AUD&marketId=ETH-AUD`
              schema:
                  type: string
        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        schema:
                            $ref: "#/components/schemas/CancelOrderResponse"
                        examples:
                            basic:
                                $ref: "#/components/examples/CancelledOrderExamples"

/v3/orders/{id}:
    get:
        tags:
            - Order Placement APIs
        operationId: getOrderById
        summary: Get an Order
        description: Returns an order by using either the exchange `orderId` or `clientOrderId`.
        parameters:
            - name: id
              in: path
              required: true
#              description:
              schema:
                  type: string

        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        examples:
                            basic:
                                $ref: "#/components/examples/BasicOrderExample"
            "404":
              description: Not found

    delete:
        summary: Cancel an Order
        tags:
            - Order Placement APIs
        operationId: cancelOrder
        description: Cancels a single order. This API returns an HTTP error `400` if the order is already canceled, matched, or partially canceled.
        parameters:
            - name: id
              in: path
              required: true
                #              description:
              schema:
                  type: string
        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        schema:
                            $ref: "#/components/schemas/CancelOrderResponse"
                        examples:
                            basic:
                                $ref: "#/components/examples/CancelledOrderExample"


    put:
      tags:
        - Order Placement APIs
      operationId: replaceOrderById
      summary: Replace an Order
      description: |
        This API combines both cancel and placement operations in a single API call.

        Upon calling this API, the system attempts to cancel the existing order. If the cancel operation is successful, then a new order is placed with exactly the same attributes (e.g., type, marketId, etc.) except for the `price` and `amount` that are provided as input to this API.

        Note:
        * The underlying actions of canceling an existing order and placing a new order at this stage are not atomic due to the asynchronous nature of the system. 
        This means that although we make our best effort to make sure the existing order is canceled successfully before placing a new order, there can be situations where the existing order may still execute and the new order is also placed (in particular, this can happen in situations when the market moves quickly in a few milliseconds).
        * For simplicity's sake, this API returns all attributes of the new order including new orderId (and new clientOrderId, if provided).
        * This API also returns all possible errors that may occur during normal cancellation and order placement.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
          content:
            application/json:
              schema:
                allOf:
                  - description: Replace an order
                    title: Replace order request
                  - $ref: "#/components/schemas/ReplaceOrderRequest"
              examples:
                bid:
                  summary: replace order example
                  value: {"price":"100.12","amount":"1.034"}


      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                basic:
                  $ref: "#/components/examples/BasicOrderExample"
                allAttributes:
                  $ref: "#/components/examples/AllOrderExample"

        "400":
          content:
            'application/json':
              examples:
                missingParam:
                  summary: missing clientOrderId
                  value: {"code":"OrderStatusIsFinal","message":"Order cancellation is not allowed"}

/v3/batchorders:
    post:
        tags:
            - Batch Order APIs
        summary: Place and Cancel Orders
        description: |

           Use this API to place multiple new orders or cancel existing ones via a single request. The request for batch processing is an array of items, and each item contains instructions for an order placement and a cancellation.
           There are restrictions on the number of items in a batch (currently set to 10), so a batch can contain up to four items in any form that is needed. For instance, it can contain four placements (hence four items in the array), four cancellations, or an array of two items with two order placements and two cancellations.

           Batch operations are only containers for multiple requests, so each individual request is handled separately from the rest of the requests in the batch.

           Once all items in the batch are processed, a single response containing orders added and orders canceled is returned along with an attribute called `unprocessedRequests` that is an array of any item in the batch that can't be processed.

           One major difference between using batch requests and individual requests is the approach to error handling. In the case of using individual requests, if the request is invalid (e.g. invalid price), then an HTTP 400 error is returned.
           However, when using batch requests (even with a single item) you will receive an HTTP code of 200 and you should parse the `unprocessedRequests` inside the response body to determine if there are any errors processing individual requests.

           There are cases where the entire batch request is considered invalid and an HTTP error `400` is returned (e.g., batch size exceeds the limit). Therefore, when handling batch requests, your client needs to handle HTTP status codes as well as error messages inside the response body.

           Another difference is that you must provide `clientOrderId` when placing orders in batch. This allows items inside a batch request to be tracked and processed accurately.
           When canceling orders, you can either use `orderId` or `clientOrderId` within the request. `clientOrderId` is only mandatory for creating new orders.

           A `requestId` that appears inside the `unprocessedRequests` represents whatever ID was used to identify an order (e.g., clientOrderId or orderId).

           One sample use case of batch processing is simulating the update order in a single HTTP call that is canceling an existing order and then creating a new order. In order to achieve this outcome, use the following request sample:

           ``` json
            [
              {
                "cancelOrder": {
                  "clientOrderId": "27"
                }
              },
              {
                "placeOrder": {
                  "marketId": "XRP-AUD",
                  "side": "Bid",
                  "type": "Limit",
                  "price": "0.22",
                  "amount": "0.26",
                  "clientOrderId": "28"
                }
              }
            ]
           ```
           In the above sample, the existing order with ID `27` is canceled and a new order with ID 28 will be created.

           You can still take advantage of `/3/batchorders{ids}` in order to cancel orders and use this API for placing orders only.

        requestBody:
            content:
                application/json:
                    schema:
                        allOf:
                            - description: Place new orders or cancel existing ones
                              title: Batch order request
                            - $ref: "#/components/schemas/BatchOrderRequests"
                    examples:
                        bid:
                          $ref: "#/components/examples/BatchOrderRequestExample"
        responses:
            "200":
                description: OK
                content:
                    'application/json':
                        schema:
                            $ref: "#/components/schemas/Order"
                        examples:
                            basic:
                                $ref: "#/components/examples/BatchOrderProcessingWithErrorExample"
                            allErrors:
                              $ref: "#/components/examples/BatchOrderProcessingAllErrorsExample"
            "400":
              description: Bad Request
              content:
                'application/json':
                  examples:
                    missingParam:
                      summary: missing clientOrderId
                      value: {"code":"InvalidClientOrderId","message":"a unique client order id is required for batch order placement"}

/v3/batchorders/{ids}:
  get:
    tags:
      - Batch Order APIs
    operationId: getOrderByIds
    summary: Get Orders by ID
    description: Retrieves a batch of orders by using either the exchange `orderId` or `clientOrderId`.

      You can specify a comma separated list of IDs with `/v3/batchorders/abc,dbc,3a,4`.
    parameters:
      - name: ids
        in: path
        required: true
        #              description:
        schema:
          type: string
          description: comma delimited list of ids

    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/BatchOrderGetExample"

      "400":
        description: Bad Request
        content:
          'application/json':
            examples:
              missingParam:
                summary: missing clientOrderId
                value:  {"code":"InvalidBatchRequest","message":"duplicate items found in the batch request"}

  delete:
      tags:
        - Batch Order APIs
      summary: Cancel Orders by ID
      description: This API can be used to cancel a list of orders specified by ID in a single request
        e.g. `/v3/batchorders/6,7,1`.

      parameters:
        - name: ids
          in: path
          required: true
          schema:
            type: string
            description: comma delimited list of ids

      responses:
        "200":
          description: OK
          content:
            'application/json':
              examples:
                basic:
                  $ref: "#/components/examples/BatchOrderCancelExample"

/v3/trades:
  get:
    tags:
      - Trade APIs
    operationId: getTrades
    summary: List Trades
    description: Retrieves trades and optionally filters by marketId or orderId/clientOrderId. The default behavior when no query parameter is specified is to return your most recent trades for all orders and markets.
      When a valid order ID is provided, all trades for the order are returned. Providing `marketId` also filters trades. Mixing `orderId` and `marketId` parameters is not supported.

    parameters:
      - name: marketId
        in: query
        required: false
        schema:
          type: string
          description: optionally filter trades by marketId (e.g. XRP-AUD)
      - name: orderId
        in: query
        required: false
        schema:
          type: string
          description: optionally list all trades for a single order

      - name: before
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234976
      - name: after
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234876
      - name: limit
        in: query
        description: This is part of the pagination parameters.
        required: false
        schema:
          type: integer
          format: int32
        example: 10

    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/TradeListExample"

/v3/trades/{id}:
  get:
    tags:
