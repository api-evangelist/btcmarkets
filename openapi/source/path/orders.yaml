/v3/markets/{marketId}/orderbook:
  get:
    tags:
      - Market Data APIs
    summary: Get Market Orderbook
    description: Retrieves list of bids and asks for a given market. Passing `level=1` returns top 50 for bids and asks. `level=0` reurns top bids and ask orders only. `level=2` returns full orderbook (full orderbook data is cached and usually updated every 10 seconds).
      Each market order is represented as an array of string `[price, volume]`. The attribute `snapshotId` is a unique number associated to orderbook and it changes every time orderbook changes.
    parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: string
      - name: level
        in: query
        required: false
        description: specifies the depth of the orderbook and possible values are 0, 1 and 2. Default level is 1 if not specified.
        schema:
          type: integer
        example: 1
    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/MarketOrderbookL1Example"

/v3/markets/{marketId}/candles:
  get:
    tags:
      - Market Data APIs
    summary: Get Market Candles
    description:  |

      Retrieves array of candles for a given market. Each candle record is an array of string representing `[time,open,high,low,close,volume]` for the time window specified (default time window is 1 day).

      This API can be used to retrieve candles either by pagination (`before`, `after`, `limit`) or by specifying timestamp parameters (`from` and/or `to`). Pagination parameters can't be combined with timestamp parameters and the default behavior is pagination when no query param is specified.

      When using timestamp parameters as query string, the maximum number of items that can be retrieved is 1000. Depending on the specified timeWindow, this can be different time windows. For instance, when using `timeWindow=1d`, up to 1000 days of market candles can be retrieved.

    parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: string
      - name: timeWindow
        in: query
        required: false
        description: values can be `1m`, `3m`, `5m`, `15m`, `30m`, `1h`, `2h`, `3h`, `4h`, `6h`, `1d`, `1w` and `1mo` representing 1 minute, 3 minutes, 5 minutes, 15 minutes, 30 minutes, 1 hour, 2 hours, 3 hours, 4 hours, 6 hours, 1 day, 1 week and 1 month. Default value is `1d` if not specified.
        schema:
          type: string
        example: 1h
      - name: from
        in: query
        required: false
        description: allows retrieving market candles from a specific time. The value is of the type timestamp and must be in ISO 8601 format. e.g. `2018-08-20T06:22:11.000000Z`.
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: allows retrieving market candles up to a specific time. The value is of the type timestamp and must be in ISO 8601 format. e.g. `2019-08-20T06:22:11.000000Z`.
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234976
      - name: after
        in: query
        required: false
        description: This is part of the pagination parameters.
        schema:
          type: integer
          format: int64
        example: 78234876
      - name: limit
        in: query
        description: This is part of the pagination parameters.
        required: false
        schema:
          type: integer
          format: int32
        example: 10

    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/MarketCandlesExample"

/v3/markets/tickers:
  get:
    tags:
      - Market Data APIs
    summary: Get Multiple Tickers
    description: |
      This API works similar to `/v3/markets/{marketId}/ticker` except it retrieves tickers for a given list of marketIds provided via query string (e.g. `?marketId=ETH-BTC&marketId=XRP-BTC`).

      To gain better performance, restrict the number of `marketIds` to the items needed for your trading app instead of requesting all markets.
    parameters:
      - name: marketId
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/MarketTickerListExample"

/v3/markets/orderbooks:
  get:
    tags:
      - Market Data APIs
    summary: Get Multiple Orderbooks
    description: |
      This API works similar to `/v3/markets/{marketId}/orderbook` except it retrieves orderbooks for a given list of marketIds provided via query string (e.g. `?marketId=ETH-BTC&marketId=XRP-BTC`).

      To gain better performance, restrict the number of `marketIds` to the items needed for your trading app instead of requesting all markets.

      Retrieving full orderbook (`level=2`) for multiple markets was mainly provided for customers who are interested in capturing and keeping full orderbook history. Therefore, it is recommended to call this API with lower frequency as the data size can be large and also cached.

    parameters:
      - name: marketId
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          'application/json':
            examples:
              basic:
                $ref: "#/components/examples/MarketOrderbookL1ListExample"

/v3/withdrawals:
  post:
    tags:
      - Fund Management APIs
    summary: Request to Withdraw
    description: |
        This API is used to request to withdraw crypto assets or `AUD`.
        ## Withdrawal/Deposit Status
        - `Accepted`: The withdrawal request has been accepted for processing.
        - `Pending Authorization`: The withdrawal request has been accepted and is being processed.
        - `Complete`: The withdrawal/deposit request has been successfully processed.
        - `Cancelled`: The withdrawal request has been canceled due to issues with the request.
        - `Failed`: The withdrawal request has been failed due to a system error.

        ## clientTransferId:
        - This is an optional parameter that can be set by the client applications to track withdrawals. In addition to retrieving withdrawal records, e.g. `GET /v3/withdrawals/a4`, it can also be useful in the event of a network issue or a timeout to track any previous withdrawal requests. It is a string field between 1 to 64 with the following characters allowed: a-z, A-Z, 0-9, - allowing standard formats like UUID.

        ## beneficiaryDetail (Travel Rule):
        - To comply with AUSTRAC's travel rule obligations, withdrawal requests can include a `beneficiaryDetail` object describing the recipient.
        - The `type` attribute can be either `Individual` or `Business`:
            - For `Individual`, supply `firstName` and `lastName`.
            - For `Business`, supply `businessName`.
        - This attribute is currently **optional**. From `2026-06-15 12:00 AEST` it will become **mandatory**, and requests without it will be rejected with the error code `InvalidTransferBeneficiaryDetail`.
        - When supplied, `beneficiaryDetail` is stored against the withdrawal record and returned in responses for listing withdrawals (`GET /v3/withdrawals`) and transfers (`GET /v3/transfers`).

    requestBody:
      content:
          application/json:
            schema:
              allOf:
                - description: request to withdraw
                  title: New request
                - $ref: "#/components/schemas/CreateWithdrawRequest"
            examples:
              crypto:
                summary: crypto
                value: {"assetName": "XRP", "amount":"25","toAddress":"abc", "clientTransferId": "a3", "beneficiaryDetail": {"type": "Individual", "firstName": "John", "lastName": "Smith"}}
              fiat:
                summary: fiat
                value: {"assetName": "AUD", "amount":"10", "accountName": "John Smith", "accountNumber":"123456", "bsbNumber":"123456", "bankName":"ABC Bank","paymentDescription":"Ref 100002","clientTransferId": "a3", "beneficiaryDetail": {"type": "Business", "businessName": "ABC Trading Inc"}}
    responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/examples/WithdrawalResponse"
              examples:
                crypto:
                  $ref: "#/components/examples/WithdrawCryptoExample"
                fiat:
                  $ref: "#/components/examples/WithdrawFiatExample"

        "400":
          content:
            'application/json':
              examples:
                missingParam:
                  summary: amount exceeds
                  value: {"code":"AmountExceedAvailableFund","message":"The amount exceeds withdrawable fund."}
                missingBeneficiary:
                  summary: missing beneficiary detail (mandatory from 2026-06-15 12:00 AEST)
                  value: {"code":"InvalidTransferBeneficiaryDetail","message":"beneficiaryDetail is required."}

  get:
    tags: 
      - Fund Management APIs
    summary: List Withdrawals
