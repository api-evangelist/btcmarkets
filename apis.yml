aid: btcmarkets

name: BTC Markets

image: https://assets.btcmarkets.net/images/marketing/og-images/og-default.jpg

description: BTC Markets is an Australian cryptocurrency exchange. Its public v3 REST API at api.btcmarkets.net covers market data (markets, tickers,
  order books, trades, candles), trading (orders, batch orders, trades), funding (deposits, withdrawals, transfers, addresses) and account data
  (balances, fees, transactions, reports), with a WebSocket feed at wss://socket.btcmarkets.net/v2 and a FIX API.

